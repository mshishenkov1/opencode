name: corp-ci

# Корпоративный CI (S-B7, S-B8).
#
# На PR в main: установка, typecheck, тесты пакетов opencode/tui/app, дымовая проверка корп-слоя
# и сборка CLI для darwin-arm64, linux-x64, win32-x64 со smoke `opencode --version`.
# На PR дополнительно собирается Desktop mac-arm64 с проверкой бандла.
# По тегу v*-magnit.*: Desktop mac-arm64 и win-x64 и черновик GitHub Release.

on:
  pull_request:
    branches:
      - main
  push:
    # Корп-работа идёт в ветках corp/**, PR в main не открывается до готовности итерации,
    # поэтому без этого триггера корп-CI не выполнялся ни разу за всю разработку.
    branches:
      - "corp/**"
    tags:
      - "v*-magnit.*"
  workflow_dispatch:

concurrency:
  group: corp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # corp/patches.test.ts сверяется с базовым тегом upstream (corp/upstream-base,
          # git diff v1.17.9) и с историей ветки. Поверхностный клон без тегов валит
          # AC-01, AC-13 и AC-112 на пустом месте.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: |
          bun run --cwd packages/core typecheck
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/tui typecheck
          bun run --cwd packages/app typecheck
          bun run --cwd packages/sdk/js typecheck

      - name: Тесты packages/opencode
        run: bun run --cwd packages/opencode test

      - name: Тесты packages/tui
        run: bun run --cwd packages/tui test

      - name: Тесты packages/app
        run: bun run --cwd packages/app test

      - name: Дымовая проверка корп-слоя (мок Hub)
        run: bun run corp/smoke.ts

  build-cli:
    name: сборка CLI ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: win32-x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # corp/patches.test.ts сверяется с базовым тегом upstream (corp/upstream-base,
          # git diff v1.17.9) и с историей ветки. Поверхностный клон без тегов валит
          # AC-01, AC-13 и AC-112 на пустом месте.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Сборка CLI
        env:
          CORP_HUB_URL: ${{ vars.CORP_HUB_URL }}
          CORP_BUILD: ${{ vars.CORP_BUILD }}
          OPENCODE_CHANNEL: magnit
        run: bun run corp/build.ts --targets ${{ matrix.target }}

      # S-B7/S-Q8: smoke выполняется только для сборки текущей ОС раннера.
      - name: Smoke — opencode --version
        if: matrix.target == 'darwin-arm64' || matrix.target == 'linux-x64'
        run: |
          BIN=packages/opencode/dist/opencode-${{ matrix.target == 'darwin-arm64' && 'darwin-arm64' || 'linux-x64' }}/bin/opencode
          "$BIN" --version

      - name: Smoke — opencode corp status без ключа
        if: matrix.target == 'linux-x64' && vars.CORP_HUB_URL != ''
        run: |
          BIN="$PWD/packages/opencode/dist/opencode-linux-x64/bin/opencode"
          HOME_DIR="$(mktemp -d)"
          set +e
          XDG_DATA_HOME="$HOME_DIR/data" XDG_CONFIG_HOME="$HOME_DIR/config" \
          XDG_CACHE_HOME="$HOME_DIR/cache" XDG_STATE_HOME="$HOME_DIR/state" NO_COLOR=1 \
            "$BIN" corp status | tee status.txt
          CODE=${PIPESTATUS[0]}
          set -e
          grep -q "ключ: нет" status.txt
          test "$CODE" = "1"

      - name: Загрузка артефактов
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-${{ matrix.target }}
          path: packages/opencode/dist/*.zip
          if-no-files-found: warn

  # На PR собирается только mac-arm64: этого хватает, чтобы поймать класс BUG-I4-002/BUG-I4-003
  # (Desktop не собирался и падал на старте, а нашли это руками). По тегу собираются обе площадки.
  build-desktop:
    name: сборка Desktop ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[{"name":"mac-arm64","runner":"macos-latest","args":"--desktop --skip-cli"},{"name":"win-x64","runner":"windows-latest","args":"--desktop --skip-cli --win"}]' || '[{"name":"mac-arm64","runner":"macos-latest","args":"--desktop --skip-cli"}]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # corp/patches.test.ts сверяется с базовым тегом upstream (corp/upstream-base,
          # git diff v1.17.9) и с историей ветки. Поверхностный клон без тегов валит
          # AC-01, AC-13 и AC-112 на пустом месте.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Сборка Desktop
        env:
          CORP_HUB_URL: ${{ vars.CORP_HUB_URL }}
          CORP_BUILD: ${{ vars.CORP_BUILD }}
          OPENCODE_CHANNEL: magnit
          CORP_DESKTOP_UPDATE_URL: ${{ vars.CORP_DESKTOP_UPDATE_URL }}
          # Подписи пока нет (согласование ИБ не пройдено): без этого electron-builder на macOS
          # ищет сертификат в связке ключей раннера и падает.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run corp/build.ts ${{ matrix.args }}

      # BUG-I4-003: сборка молча заканчивалась без Electron-приложения. Проверяем сам бандл,
      # а не только наличие архива.
      - name: Проверка бандла Desktop
        if: matrix.name == 'mac-arm64'
        run: |
          set -euo pipefail
          app=$(ls -d packages/desktop/dist/mac-arm64/*.app | head -1)
          test -n "$app"
          test -d "$app/Contents/Frameworks/Electron Framework.framework"
          test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          ls packages/desktop/dist/*.dmg packages/desktop/dist/*.zip

      # directories.output в electron-builder.config.ts — dist; каталога release не существует,
      # и с прежним путём задание выкладывало пустоту (if-no-files-found: warn это не показывал).
      # Идентичность корпоративной сборки и источник обновлений (AC-139, AC-149, AC-153):
      # свой appId и имя, фид только из переменной сборки, чужого фида в конфигурации нет.
      - name: Идентичность и обновления Desktop
        if: matrix.name == 'mac-arm64'
        run: |
          if [ -n "${CORP_DESKTOP_UPDATE_URL:-}" ]; then
            bun run corp/verify-desktop-bundle.ts packages/desktop/dist --update-url "$CORP_DESKTOP_UPDATE_URL"
          else
            bun run corp/verify-desktop-bundle.ts packages/desktop/dist
          fi
        env:
          CORP_DESKTOP_UPDATE_URL: ${{ vars.CORP_DESKTOP_UPDATE_URL }}

      - name: Загрузка артефактов
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-${{ matrix.name }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/*.yml
          if-no-files-found: error

  release:
    name: черновик релиза
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-magnit.')
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # corp/patches.test.ts сверяется с базовым тегом upstream (corp/upstream-base,
          # git diff v1.17.9) и с историей ветки. Поверхностный клон без тегов валит
          # AC-01, AC-13 и AC-112 на пустом месте.
          fetch-depth: 0

      - name: Скачивание артефактов
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Список и sha256
        run: |
          find artifacts -type f | sort > files.txt
          : > notes.md
          echo "Корпоративная сборка OpenCode ${GITHUB_REF_NAME}." >> notes.md
          echo >> notes.md
          echo "| Артефакт | sha256 |" >> notes.md
          echo "|---|---|" >> notes.md
          while read -r file; do
            echo "| $(basename "$file") | \`$(sha256sum "$file" | cut -d' ' -f1)\` |" >> notes.md
          done < files.txt
          cat notes.md

      - name: Черновик GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes-file notes.md \
            $(find artifacts -type f | sort | tr '\n' ' ')
