name: corp-ci

# Корпоративный CI (S-B7, S-B8).
#
# На PR в main: установка, typecheck, тесты пакетов opencode/tui/app и наборов corp/, дымовая
# проверка корп-слоя и сборка CLI для darwin-arm64, darwin-x64, linux-x64, win32-x64 со smoke
# `opencode --version` на целях, исполнимых раннером.
# На PR дополнительно собирается Desktop mac-arm64 с проверкой бандла.
# По тегу v*-magnit.*: Desktop macOS обеих архитектур (arm64 и x64) с проверкой обоих бандлов и
# фида раздачи, черновик GitHub Release и публикация на внутренний сервер (S-B16).
#
# Windows-сборки Desktop в матрице тегов нет (решение заказчика, ревизия 1.11): парк — macOS.
# Конфигурация NSIS в electron-builder.config.ts не тронута — Windows вернётся флагом, а не
# восстановлением удалённого кода.

on:
  pull_request:
    branches:
      - main
  push:
    # Корп-работа идёт в ветках corp/**, PR в main не открывается до готовности итерации,
    # поэтому без этого триггера корп-CI не выполнялся ни разу за всю разработку.
    branches:
      - "corp/**"
    tags:
      - "v*-magnit.*"
  workflow_dispatch:

concurrency:
  group: corp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # corp/patches.test.ts сверяется с базовым тегом upstream (corp/upstream-base,
          # git diff v1.17.9) и с историей ветки. Поверхностный клон без тегов валит
          # AC-01, AC-13 и AC-112 на пустом месте.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: |
          bun run --cwd packages/core typecheck
          bun run --cwd packages/opencode typecheck
          bun run --cwd packages/tui typecheck
          bun run --cwd packages/app typecheck
          bun run --cwd packages/sdk/js typecheck

      - name: Тесты packages/opencode
        run: bun run --cwd packages/opencode test

      - name: Тесты packages/tui
        run: bun run --cwd packages/tui test

      - name: Тесты packages/app
        run: bun run --cwd packages/app test

      - name: Браузер для тестов раскладки
        run: bun x playwright install --with-deps chromium

      - name: Тесты раскладки корп-окон (packages/app)
        run: bun --cwd packages/app x playwright test --config test-layout/playwright.config.ts

      # Наборы corp/*.test.ts не запускались корп-CI ни одним заданием: скрипт `test` пакета
      # opencode работает с cwd packages/opencode и каталог corp/ не обходит, а корневой `bun test`
      # отключён намеренно (F32). Весь доказательный аппарат S-B6, S-B16 и S-Q11 — реестр правок
      # upstream, порядок публикации, гейт по секрету, вычисление номера тега — исполнялся только
      # руками. Прогон отсюда: скрипт пакета берётся ради общего --timeout, пути — до corp/.
      - name: Тесты corp/
        run: bun run --cwd packages/opencode test ../../corp/

      - name: Дымовая проверка корп-слоя (мок Hub)
        run: bun run corp/smoke.ts

  build-cli:
    name: сборка CLI ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          # Intel-парк: без этой цели пакет установщика darwin-x64 не собрать из артефактов
          # прогона — find_cli_binary в installers/release.sh не найдёт opencode-darwin-x64, и
          # цепочка «тег → артефакты → пакет» для Intel остаётся разорванной на звене CLI, даже
          # когда Desktop для x64 уже собирается. bun кросс-компилирует цель, отдельный
          # Intel-раннер не нужен; smoke на ней не выполняется — раннер arm64 (S-B7).
          - target: darwin-x64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: win32-x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # corp/patches.test.ts сверяется с базовым тегом upstream (corp/upstream-base,
          # git diff v1.17.9) и с историей ветки. Поверхностный клон без тегов валит
          # AC-01, AC-13 и AC-112 на пустом месте.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Сборка CLI
        env:
          CORP_HUB_URL: ${{ vars.CORP_HUB_URL }}
          # См. пояснение в задании build-desktop: на теге источник номера сборки — corp/version.
          CORP_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && '' || vars.CORP_BUILD }}
          OPENCODE_CHANNEL: magnit
        run: bun run corp/build.ts --targets ${{ matrix.target }}

      # S-B7/S-Q8: smoke выполняется только для сборки текущей ОС раннера.
      - name: Smoke — opencode --version
        if: matrix.target == 'darwin-arm64' || matrix.target == 'linux-x64'
        run: |
          BIN=packages/opencode/dist/opencode-${{ matrix.target == 'darwin-arm64' && 'darwin-arm64' || 'linux-x64' }}/bin/opencode
          "$BIN" --version

      - name: Smoke — opencode corp status без ключа
        if: matrix.target == 'linux-x64' && vars.CORP_HUB_URL != ''
        run: |
          BIN="$PWD/packages/opencode/dist/opencode-linux-x64/bin/opencode"
          HOME_DIR="$(mktemp -d)"
          set +e
          XDG_DATA_HOME="$HOME_DIR/data" XDG_CONFIG_HOME="$HOME_DIR/config" \
          XDG_CACHE_HOME="$HOME_DIR/cache" XDG_STATE_HOME="$HOME_DIR/state" NO_COLOR=1 \
            "$BIN" corp status | tee status.txt
          CODE=${PIPESTATUS[0]}
          set -e
          grep -q "ключ: нет" status.txt
          test "$CODE" = "1"

      - name: Загрузка артефактов
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-${{ matrix.target }}
          path: packages/opencode/dist/*.zip
          if-no-files-found: warn

  # На PR собирается только архитектура раннера: этого хватает, чтобы поймать класс
  # BUG-I4-002/BUG-I4-003 (Desktop не собирался и падал на старте, а нашли это руками). По тегу
  # собираются обе архитектуры macOS ОДНИМ заданием: electron-builder пишет один фид
  # `magnit-mac.yml` со списком `files` для arm64 и x64, а два задания дали бы два фида, из которых
  # на сервере остался бы последний — половина парка перестала бы видеть обновления (S-B16).
  build-desktop:
    name: сборка Desktop ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[{"name":"mac","runner":"macos-latest","args":"--desktop --skip-cli --arm64 --x64"}]' || '[{"name":"mac-arm64","runner":"macos-latest","args":"--desktop --skip-cli"}]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # corp/patches.test.ts сверяется с базовым тегом upstream (corp/upstream-base,
          # git diff v1.17.9) и с историей ветки. Поверхностный клон без тегов валит
          # AC-01, AC-13 и AC-112 на пустом месте.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Сборка Desktop
        env:
          CORP_HUB_URL: ${{ vars.CORP_HUB_URL }}
          # На теге номер сборки берётся из corp/version помеченного коммита (его ставит автотег
          # corp-release.yml): иначе переменная репозитория переписала бы версию артефактов, и имя
          # тега разошлось бы с тем, что внутри (S-B1, S-B16).
          CORP_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && '' || vars.CORP_BUILD }}
          OPENCODE_CHANNEL: magnit
          CORP_DESKTOP_UPDATE_URL: ${{ vars.CORP_DESKTOP_UPDATE_URL }}
          # Подписи пока нет (согласование ИБ не пройдено): без этого electron-builder на macOS
          # ищет сертификат в связке ключей раннера и падает.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run corp/build.ts ${{ matrix.args }}

      # BUG-I4-003: сборка молча заканчивалась без Electron-приложения. Проверяем сам бандл,
      # а не только наличие архива. Каталог вывода зависит от архитектуры (`mac-arm64` и `mac`),
      # поэтому проверяются ВСЕ бандлы: пропуск одного вернул бы ровно тот дефект, ради которого
      # шаг заведён, — но только для половины парка.
      - name: Проверка бандла Desktop
        if: startsWith(matrix.name, 'mac')
        run: |
          set -euo pipefail
          count=0
          for app in packages/desktop/dist/mac*/*.app; do
            test -d "$app"
            echo "бандл: $app"
            test -d "$app/Contents/Frameworks/Electron Framework.framework"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
            count=$((count + 1))
          done
          test "$count" -ge 1
          ls packages/desktop/dist/*.dmg packages/desktop/dist/*.zip

      # directories.output в electron-builder.config.ts — dist; каталога release не существует,
      # и с прежним путём задание выкладывало пустоту (if-no-files-found: warn это не показывал).
      # Идентичность корпоративной сборки и источник обновлений (AC-139, AC-149, AC-153):
      # свой appId и имя, фид только из переменной сборки, чужого фида в конфигурации нет.
      # С адресом обновлений дополнительно проверяется фид раздачи magnit-mac.yml (S-B16):
      # он обязан лежать рядом с архивами и называть их фактический sha512.
      - name: Идентичность и обновления Desktop
        if: startsWith(matrix.name, 'mac')
        run: |
          if [ -n "${CORP_DESKTOP_UPDATE_URL:-}" ]; then
            bun run corp/verify-desktop-bundle.ts packages/desktop/dist --update-url "$CORP_DESKTOP_UPDATE_URL"
          else
            bun run corp/verify-desktop-bundle.ts packages/desktop/dist
          fi
        env:
          CORP_DESKTOP_UPDATE_URL: ${{ vars.CORP_DESKTOP_UPDATE_URL }}

      # Последняя строка path — исключение: builder-debug.yml это отладочный дамп конфигурации
      # electron-builder, а не фид (AC-258). Он появляется только при debug-логировании, но тогда
      # уезжает и в артефакты, и через задание release — в черновик, где оказывается вторым yml
      # рядом с фидом раздачи.
      - name: Загрузка артефактов
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-${{ matrix.name }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/*.yml
            !packages/desktop/dist/builder-debug.yml
          if-no-files-found: error

  # Публикация на внутренний сервер раздачи (S-B16). Именно с него читают апдейтер Desktop и
  # `opencode upgrade`, поэтому без этого задания цепочка обрывалась на артефактах прогона.
  #
  # Гейт по секрету — шагом, а не условием задания: секреты в `if:` уровня job недоступны, и без
  # шага-гейта задание падало бы красным на каждом теге, пока внутренний хост не заведён. Скип
  # печатает причину: «нечего публиковать» обязано быть отличимо от «не настроено».
  publish:
    name: публикация на внутренний сервер
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-magnit.')
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, настроен ли внутренний сервер
        id: gate
        env:
          ENDPOINT: ${{ secrets.CORP_ARTIFACTS_ENDPOINT }}
        run: |
          if [ -z "${ENDPOINT:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # Формулировка — дословно из S-B16 п. 5 и AC-261: «публиковать некуда» обязано быть
            # отличимо в логе от «публиковать нечего».
            echo "::notice::внутренний сервер не настроен — публикация пропущена, артефакты остаются в прогоне и в черновике релиза (секрет CORP_ARTIFACTS_ENDPOINT не задан)"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/setup-bun

      - name: Скачивание артефактов
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # Порядок выкладки задаёт сам скрипт: сначала архивы, затем фиды (magnit-mac.yml и
      # <CLI>/latest). Клиент, опросивший фид в момент выкладки, получит либо старую версию
      # целиком, либо новую целиком, но не «версию, которой ещё нет».
      - name: Выкладка
        if: steps.gate.outputs.ready == 'true'
        env:
          CORP_ARTIFACTS_ENDPOINT: ${{ secrets.CORP_ARTIFACTS_ENDPOINT }}
          CORP_ARTIFACTS_TOKEN: ${{ secrets.CORP_ARTIFACTS_TOKEN }}
          CORP_ARTIFACTS_USER: ${{ secrets.CORP_ARTIFACTS_USER }}
          CORP_ARTIFACTS_PASSWORD: ${{ secrets.CORP_ARTIFACTS_PASSWORD }}
          CORP_DESKTOP_UPDATE_URL: ${{ vars.CORP_DESKTOP_UPDATE_URL }}
          CORP_CLI_UPDATE_URL: ${{ vars.CORP_CLI_UPDATE_URL }}
        run: bun run corp/build.ts --from-dist artifacts --publish --publish-to internal

  release:
    name: черновик релиза
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-magnit.')
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # corp/patches.test.ts сверяется с базовым тегом upstream (corp/upstream-base,
          # git diff v1.17.9) и с историей ветки. Поверхностный клон без тегов валит
          # AC-01, AC-13 и AC-112 на пустом месте.
          fetch-depth: 0

      - name: Скачивание артефактов
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Список и sha256
        run: |
          find artifacts -type f | sort > files.txt
          : > notes.md
          echo "Корпоративная сборка OpenCode ${GITHUB_REF_NAME}." >> notes.md
          echo >> notes.md
          echo "| Артефакт | sha256 |" >> notes.md
          echo "|---|---|" >> notes.md
          while read -r file; do
            echo "| $(basename "$file") | \`$(sha256sum "$file" | cut -d' ' -f1)\` |" >> notes.md
          done < files.txt
          cat notes.md

      - name: Черновик GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes-file notes.md \
            $(find artifacts -type f | sort | tr '\n' ' ')
