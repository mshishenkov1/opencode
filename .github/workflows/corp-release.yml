# Автотег корпоративной сборки после мержа upstream (S-B16).
#
# Разрыв, который закрывает этот workflow: upstream-sync.yml сливал свежий релиз upstream в
# корп-ветку, но тега никто не ставил, а вся раздача (сборка Desktop, черновик релиза, публикация)
# в corp-ci.yml висит на теге `v*-magnit.*`. Цепочка обрывалась ровно посередине, и релиз
# выкатывался руками.
#
# Условие запуска — коммит мержа, который делает upstream-sync.yml («corp: слить upstream <тег>»),
# либо ручной запуск. Обычные корп-коммиты тега не порождают: тег означает «состав раздачи
# изменился», а не «в ветку что-то прилетело».
#
# Номер корп-сборки N (S-B1): при смене версии upstream счёт начинается заново с 1, иначе N+1 к
# максимуму уже выпущенных тегов той же версии upstream. Тег идемпотентен: повторный запуск на уже
# помеченном коммите завершается успехом и ничего не делает — иначе перезапуск задания плодил бы
# теги на одном и том же составе.
name: corp-release

on:
  push:
    branches:
      - "corp/**"
  workflow_dispatch:

concurrency:
  # Тег ставится последовательно: два одновременных запуска вычислили бы один и тот же N.
  group: corp-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: автотег версии сборки
    # Ручной запуск — всегда; push — только для коммита мержа upstream (см. upstream-sync.yml).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'corp: слить upstream ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Нужны все теги: N вычисляется по уже выпущенным `v*-magnit.*`.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Вся арифметика номера — в corp/next-tag.sh: шаг `run:` внутри YAML тестами не достаётся, а
      # неверный N означает либо тег на уже выпущенном составе, либо перезапись раздачи (S-Q11).
      # Скрипт только считает: тег ставит следующий шаг.
      - name: Вычислить номер корп-сборки
        id: version
        run: |
          # pipefail обязателен: по умолчанию GitHub запускает шаг как `bash -e`, и код возврата
          # next-tag.sh скрылся бы за успешным tee — отказ вычисления выглядел бы как «тег не нужен».
          set -euo pipefail
          bash corp/next-tag.sh | tee -a "$GITHUB_OUTPUT"

      - name: Коммит, тег и push
        if: steps.version.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "corp-release[bot]"
          git config user.email "corp-release@users.noreply.github.com"
          # corp/version — единственный источник N для сборки по тегу (corpVersion(), corp/build.ts):
          # на теге corp-ci.yml не подставляет CORP_BUILD, и версия артефактов берётся отсюда.
          printf '%s\n' "${{ steps.version.outputs.build }}" > corp/version
          git add corp/version
          # Каждый корп-коммит обязан начинаться с "corp: " (S-C8, AC-13).
          git commit -m "corp: версия сборки ${{ steps.version.outputs.build }}"
          git tag "${{ steps.version.outputs.tag }}"
          # Сначала ветка, затем тег: тег обязан указывать на коммит, который есть в ветке, иначе
          # corp/version в сборке по тегу разойдётся с историей. Push тега включает существующие
          # триггеры corp-ci.yml (сборка Desktop, черновик релиза, публикация).
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "Поставлен тег ${{ steps.version.outputs.tag }}"

      - name: Тег не требуется
        if: steps.version.outputs.skip == 'true'
        run: |
          echo "Новый тег не нужен: состав раздачи уже помечен."
