# Автотег корпоративной сборки после мержа upstream (S-B16).
#
# Разрыв, который закрывает этот workflow: upstream-sync.yml сливал свежий релиз upstream в
# корп-ветку, но тега никто не ставил, а вся раздача (сборка Desktop, черновик релиза, публикация)
# в corp-ci.yml висит на теге `v*-magnit.*`. Цепочка обрывалась ровно посередине, и релиз
# выкатывался руками.
#
# Условие запуска — коммит мержа, который делает upstream-sync.yml («corp: слить upstream <тег>»),
# либо ручной запуск. Обычные корп-коммиты тега не порождают: тег означает «состав раздачи
# изменился», а не «в ветку что-то прилетело».
#
# Номер корп-сборки N (S-B1): при смене версии upstream счёт начинается заново с 1, иначе N+1 к
# максимуму уже выпущенных тегов той же версии upstream. Тег идемпотентен: повторный запуск на уже
# помеченном коммите завершается успехом и ничего не делает — иначе перезапуск задания плодил бы
# теги на одном и том же составе.
name: corp-release

on:
  push:
    branches:
      - "corp/**"
  workflow_dispatch:

concurrency:
  # Тег ставится последовательно: два одновременных запуска вычислили бы один и тот же N.
  group: corp-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: автотег версии сборки
    # Ручной запуск — всегда; push — только для коммита мержа upstream (см. upstream-sync.yml).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'corp: слить upstream ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Нужны все теги: N вычисляется по уже выпущенным `v*-magnit.*`.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Вычислить номер корп-сборки
        id: version
        run: |
          set -euo pipefail

          # Уже помеченный коммит — выходим успешно (идемпотентность).
          existing=$(git tag --points-at HEAD --list 'v*-magnit.*' | head -1)
          if [ -n "$existing" ]; then
            echo "Коммит уже помечен тегом $existing — делать нечего."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("packages/opencode/package.json","utf8")).version)')
          echo "версия upstream: $upstream"

          # Максимальный N среди тегов ТОЙ ЖЕ версии upstream. Пусто — версия upstream сменилась
          # (или тегов ещё нет), и счёт начинается заново с 1 (S-B1).
          last=$(git tag --list "v$upstream-magnit.*" \
            | sed -n "s|^v$upstream-magnit\.\([0-9][0-9]*\)$|\1|p" \
            | sort -n | tail -1)
          if [ -z "$last" ]; then
            build=1
            echo "тегов версии upstream $upstream нет — номер сборки сбрасывается в 1"
          else
            build=$((last + 1))
            echo "последний тег версии upstream $upstream — v$upstream-magnit.$last"
          fi

          # corp/version — единственный источник N для сборки (corpVersion(), corp/build.ts).
          # Версия тега печатается тем же кодом, что соберёт артефакты: расхождение имени тега и
          # версии артефактов невозможно по построению.
          printf '%s\n' "$build" > corp/version
          version=$(bun run corp/build.ts --print-version)
          tag="v$version"
          echo "версия сборки: $version"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Тег $tag уже существует — делать нечего."
            git checkout -- corp/version
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "skip=false"
            echo "build=$build"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Коммит, тег и push
        if: steps.version.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "corp-release[bot]"
          git config user.email "corp-release@users.noreply.github.com"
          git add corp/version
          # Каждый корп-коммит обязан начинаться с "corp: " (S-C8, AC-13).
          git commit -m "corp: версия сборки ${{ steps.version.outputs.build }}"
          git tag "${{ steps.version.outputs.tag }}"
          # Сначала ветка, затем тег: тег обязан указывать на коммит, который есть в ветке, иначе
          # corp/version в сборке по тегу разойдётся с историей. Push тега включает существующие
          # триггеры corp-ci.yml (сборка Desktop, черновик релиза, публикация).
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "Поставлен тег ${{ steps.version.outputs.tag }}"

      - name: Тег не требуется
        if: steps.version.outputs.skip == 'true'
        run: |
          echo "Новый тег не нужен: состав раздачи уже помечен."
