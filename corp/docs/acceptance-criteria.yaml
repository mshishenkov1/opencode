    type: integration
    given: >
      electron-store opencode.updater содержит запись ready с version 1.18.19, оставшуюся от прежней
      сборки, апдейтер выключен (CORP_DESKTOP_UPDATE_URL не задан)
    when: приложение запущено и закрыто
    then: >
      установка не выполняется, диалог «Restart now?» не показывается, запись ready удалена,
      после перезапуска версия приложения остаётся корпоративной (<версия upstream>-magnit.N)
    negative: true

  - id: AC-149
    rule: [S-B11, S-B9]
    type: ci
    given: собранный артефакт Desktop канала magnit
    when: выполнен поиск по содержимому бандла
    then: >
      ни один файл конфигурации обновлений не содержит provider: github, owner: anomalyco или
      github.com/anomalyco; при обнаружении такой строки шаг CI падает
    negative: true

  - id: AC-150
    rule: [S-B12]
    type: manual
    given: на одной машине установлены ванильный OpenCode и корпоративная сборка
    when: запущены оба приложения подряд
    then: >
      оба открыты одновременно, каждое своим окном; запуск одного не переводит фокус на окно другого;
      в списке приложений видны две записи — «OpenCode» и «OpenCode Magnit»

  - id: AC-151
    rule: [S-B12]
    type: manual
    given: обе сборки установлены, в корпоративной выполнен вход по корпоративному SSO
    when: открыт ванильный OpenCode
    then: >
      ванильная сборка не показывает корп-режим, не знает о ключе magnit_prod, её настройки и сессии
      не изменились; корпоративная сборка после этого продолжает работать с сохранённым ключом

  - id: AC-152
    rule: [S-Q10]
    type: unit
    given: тест конфигурации упаковки Desktop
    when: тест выполнен
    then: >
      покрыты каналы magnit, dev, beta, prod (upstream-значения appId, productName и publish, включая
      owner: "anomalyco" у prod), неизвестное значение (исключение) и незаданная переменная (dev),
      а также обе ветки фида обновлений — с CORP_DESKTOP_UPDATE_URL (provider generic и ровно этот
      адрес) и без неё (блока publish нет)

  - id: AC-153
    rule: [S-Q10, S-B8]
    type: ci
    given: шаг CI, собравший Desktop канала magnit
    when: выполнена проверка артефакта
    then: >
      проверены CFBundleIdentifier, CFBundleName и наличие/содержимое app-update.yml; шаг падает при
      чужом appId, чужом имени приложения или фиде, отличном от адреса из CORP_DESKTOP_UPDATE_URL

