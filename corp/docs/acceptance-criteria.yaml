# Критерии приёмки I-4: корпоративный форк OpenCode
# Спецификация: corp/docs/spec.md (ревизия 1.9)
# Формат: id, rule (правила спецификации), type (unit|integration|manual|ci), given/when/then.
# Все HTTP-обращения к Hub в автотестах — только к мокам, без сети.
#
# Ревизия 1.1 (2026-08-20): переформулированы AC-33, AC-35, AC-94 (расхождение с правилами
# S-A11/S-I2, на которые они ссылаются); добавлены AC-122 (нет ключа -> код выхода 1) и
# AC-123 (приоритет navigator.languages при поддерживаемой локали). Существующие ID не менялись,
# требования не ослаблялись. Подробности — блок «Ревизия 1.1» в начале spec.md.
#
# Ревизия 1.3 (2026-08-20): ИЗМЕНЕНИЕ ТРЕБОВАНИЙ ЗАКАЗЧИКА, а не уточнение формулировок.
# Добавлены AC-124 (пункт «Коннекторы» в развёрнутой боковой панели Home, над «Настройками»),
# AC-125 (иконка коннекторов в свёрнутой панели, над шестерёнкой) и AC-126 (при первом запуске
# предложение войти по корпоративному SSO видно сразу, без ввода команд). Новые правила спецификации —
# S-D2a, S-D2b, S-D4a; уточнены S-D2, S-D4, S-A7, S-I1, S-Q9. Существующие ID не менялись и не
# ослаблялись. Требуемое поведение AC-124..AC-126 на момент ревизии в коде отсутствует.
# Подробности — блок «Ревизия 1.3» в начале spec.md.
#
# Ревизия 1.4 (2026-08-20): ИЗМЕНЕНИЕ КОНТРАКТА по BUG-I1-002 (critical). Корпоративный LiteLLM при SSO
# не отдаёт email, Hub присылает user.email отсутствующим или null; клиент отбрасывал такой ready-ответ
# как hub_invalid_response и терял уже выданный ключ. Email объявлен необязательным полем (новое правило
# S-A13, решение D-19; уточнены §3.1, §3.2, S-A1, S-A6, S-A10, S-A11, S-A11a, S-V2, S-Q3).
# Добавлены AC-127 (ready с email:null принят, ключ сохранён), AC-128 (ready без поля email принят),
# AC-129 (экран входа и `corp login` показывают user_id вместо неизвестного email),
# AC-130 (`corp status` печатает «Пользователь: <user_id>»), AC-131 (заголовок витрины показывает
# user_id вместо неизвестного email). Существующие ID не менялись и не ослаблялись; AC-17 и AC-34
# остаются в силе для случая, когда email известен. Требуемое поведение AC-127..AC-131 на момент
# ревизии в коде отсутствует. Подробности — блок «Ревизия 1.4» в начале spec.md.

# Ревизия 1.7 (2026-08-21): ИЗМЕНЕНИЕ КОНТРАКТА по BUG-I4-008 (critical). Hub ввёл третью модель прав
# permission_model.kind: tool_filter (пресеты readonly/readwrite, значение пресета — объект
# {tools:[имя или шаблон]}); схема форка описывает presets как Record<string,string>, карточка tag
# разбор не проходит, и по прежней редакции S-V2 отбрасывался весь ответ GET /api/catalog: витрина
# пуста, «Hub returned an unexpected response», хотя Hub отвечает 200. Это второй случай класса
# (BUG-I1-002 — обязательный email), поэтому изменено само правило разбора: новое правило S-V14
# (ядро карточки alias/title/mode/mcp_url отбрасывает карточку, всё остальное деградирует, ответ
# целиком отбрасывается только при нарушении конверта version/servers), переформулировано S-V9
# (экран прав по видам модели, включая неизвестный), уточнены §3.2, §3.3, S-V1, S-V2, S-V3, S-V12,
# S-I1, S-Q2, S-Q4; решения D-26, D-27, D-28.
# Переформулирован AC-40 (карточка без alias отбрасывается, остальные принимаются — прежняя проверка
# «весь ответ отброшен» перенесена на нарушенный конверт, AC-160). Добавлены AC-154…AC-167.
# Требуемое поведение AC-154…AC-167 на момент ревизии в коде отсутствует.
# Подробности — блок «Ревизия 1.7» в начале spec.md.
#
# Ревизия 1.9 (2026-08-25): ИЗМЕНЕНИЕ ТРЕБОВАНИЙ ЗАКАЗЧИКА по BUG-I4-010 (high) плюс три хвоста
# сборки. Правила действий витрины выводились из локального статуса MCP и не знали, подключался ли
# пользователь к серверу когда-нибудь: needs_auth давал ["connect","disconnect"], failed —
# ["reconnect","disconnect"], то есть «Отключить» показывалось серверу, который никогда не был
# подключён; у подключённого не было явного признака подключения, кроме подписи мелким шрифтом;
# ошибка подключения не объяснялась; окно витрины было ниже окна настроек. Продуктовое решение
# заказчика: набор действий определяется признаком «подключение состоялось» (новое правило S-V15),
# состояния и действия заданы таблицей S-V16 («Отключить» только у подключённого, «Повторить» и
# «Убрать из списка» — у потерянного соединения, «Подключить» — у неподключавшегося), добавлены
# S-V17 («Убрать из списка»), S-V18 (явный признак «Подключено»), S-V19 (классы ошибок подключения),
# S-D10 (размер окна витрины = окну настроек, высота фиксирована), S-T10 (паритет TUI).
# Три хвоста: S-B13 (собственный каталог кеша обновлений канала magnit; S-B9 дополнен пунктом «д»),
# S-B14 (явный opencode upgrade не ходит наружу), S-B15 (заголовок окна из имени сборки канала).
# Решения D-30…D-34; факты F42…F45. Переформулирован ОДИН критерий — AC-51: обе его прежние проверки
# (статус unavailable, подпись содержит текст ошибки) сохранены дословно, а проверка набора действий
# СТРОЖЕ прежней — вместо одного набора на все случаи failed требуется разный набор в зависимости от
# признака S-V15 и прямо запрещается «Отключить» там, где подключения не было. Добавлены
# AC-170…AC-199. Прочие существующие ID не менялись, не переименовывались и не ослаблялись; AC-50
# (alias вне каталога) остаётся в силе дословно. Требуемое поведение AC-170…AC-199 на момент ревизии
# в коде отсутствует. Подробности — блок «Ревизия 1.9» в начале spec.md.
#
# Ревизия 1.8 (2026-08-21): ИСПРАВЛЕНИЕ КОНТРАКТА по спорному п.1 S-V14. Сверка с источником истины на
# стороне Hub (спека Hub R-C1 «version (целое ≥ 1)» и R-A3, src/hub/catalog.py::parse_catalog с
# проверкой isinstance(version, int) и Catalog.version: int, роут api_catalog, catalog.yaml version: 1,
# живой стенд GET /api/catalog -> {"version": 1, ...}) показала: Hub свой контракт не нарушает, а
# «version — строка» было ошибкой спецификации форка. S-V14 п.1: version принимается числом или
# строкой и нормализуется к строке (D-29); п.6: конверт GET /api/me/connections — массив верхнего
# уровня, тело не массив -> hub_invalid_response. AC-160 УСИЛЕН: обе прежние проверки сохранены
# дословно, добавлен третий случай отказа (version недопустимого типа). Исправлена фикстура AC-154
# (auth_kind живой карточки tag — user_token, а не oauth2; «все четыре элемента» -> «все три»);
# проверяемое поведение AC-154 не изменено. Добавлены AC-168 и AC-169. Существующие ID не менялись,
# не переименовывались и не ослаблялись. Требуемое поведение AC-168, AC-169 на момент ревизии в коде
# отсутствует. Подробности — блок «Ревизия 1.8» в начале spec.md.
#
# Ревизия 1.6 (2026-08-21): ИЗМЕНЕНИЕ КОНТРАКТА по живой проверке раздачи Desktop. Корпоративная сборка
# использовала идентичность ванильного апстрима: corp/build.ts переводил канал latest в десктопный prod,
# а prod в packages/desktop/electron-builder.config.ts — это appId ai.opencode.desktop и
# publish github/anomalyco/opencode. Следствия: сборка не запускалась рядом с ванильным OpenCode
# (общий appId => общий каталог данных и общая блокировка экземпляра), а её апдейтер скачал ванильный
# OpenCode 1.18.19 с чужих релизов и был готов подменить корпоративную сборку.
# Правило S-B9 переформулировано: заморозка electron-builder.config.ts заменена разрешением ровно на
# корпоративный канал (часть про подпись сохранена). Новые правила S-B10 (канал magnit: appId
# ai.opencode.desktop.magnit, productName «OpenCode Magnit», каталог данных, имена артефактов,
# неизвестный канал — ошибка вместо молчаливого dev), S-B11 (обновления с внутреннего сервера по адресу
# из переменной сборки CORP_DESKTOP_UPDATE_URL; переменная не задана — апдейтер выключен), S-B12
# (сосуществование с ванильной сборкой), S-Q10 (тесты идентичности и фида); дополнено S-B3 (latest и
# magnit дают десктопный канал magnit); новые факты F39, F40, F41; решения D-23, D-24, D-25.
# ПЕРЕФОРМУЛИРОВАН AC-112: вместо «файл не изменён» — «изменения ограничены каналом magnit, ветки
# dev/beta/prod совпадают с upstream по appId, productName и publish, блоки подписи не тронуты».
# Добавлены AC-138 … AC-153. Существующие ID не удалялись и не ослаблялись.
# Подробности — блок «Ревизия 1.6» в начале spec.md.

# Ревизия 1.5 (2026-08-21): ИСПРАВЛЕНИЕ КОНТРАКТА по живой проверке корпоративной сборки.
# Спецификация закрепляла нерабочую схему подключения к модели: корп-конфиг задавал несуществующий
# хост copilot.magnit.ru и брал ключ из переменной MAGNIT_COPILOT_KEY, из-за чего чат не работал вовсе,
# а вход по SSO терял смысл (значение apiKey из конфига перекрывает ключ из auth-store, факт F37).
# Рабочий адрес — https://llmlite.ailab-copilot-prod.corp.tander.ru/v1, ключ приходит из auth-store
# (S-A3); правка конфига сборки — коммит d7c9865. Новые правила S-C4a (адрес модели и переопределение
# переменной OPENCODE_CORP_MODEL_BASE_URL), S-C4b (ключ только из auth-store и поведение без ключа),
# S-C9 (диагностика конфликтов личного конфига: disabled_providers и локальный mcp.<alias>);
# новые факты F37, F38; решения D-20, D-21, D-22; дополнены S-C4, S-A11a, S-Q6.
# ПЕРЕФОРМУЛИРОВАН AC-07 (ожидания приведены к проверенной схеме; требование «нет секретов» усилено
# запретом самого ключа options.apiKey). Добавлены AC-132 (переопределение адреса переменной окружения),
# AC-133 (пользовательский слой выше переменной), AC-134 (чат работает сразу после входа),
# AC-135 (нет ключа -> запрос не уходит, названа причина), AC-136 (disabled_providers),
# AC-137 (локально переопределённый mcp.<alias>). Существующие ID не менялись и не ослаблялись.
# Требуемое поведение AC-132, AC-133, AC-135, AC-136, AC-137 на момент ревизии в коде отсутствует.
# Подробности — блок «Ревизия 1.5» в начале spec.md.

version: 1.9
spec: corp/docs/spec.md
criteria:

  # ---------------------------------------------------------------- S-C*: умолчания и конфигурация
  - id: AC-01
    rule: [S-C1]
    type: unit
    given: репозиторий форка на ветке corp/i4-sso-connectors
    when: перечислено содержимое каталога corp/
    then: >
      присутствуют corp/config/opencode.corp.json, corp/README.md, corp/patches.md,
      corp/docs/spec.md, corp/docs/acceptance-criteria.yaml, corp/build.ts,
      corp/upstream-sync.sh, corp/plugin/README.md

  - id: AC-02
    rule: [S-C1]
    type: ci
    given: чистая установка зависимостей
    when: выполнен `bun run typecheck`
    then: команда завершается кодом 0, каталог corp/ не даёт ошибок типизации

  - id: AC-03
    rule: [S-C2]
    type: unit
    given: сборка с CORP_HUB_URL=https://hub.test и файлом corp/config/opencode.corp.json
    when: собран бинарник
    then: >
      в define переданы OPENCODE_CORP_HUB_URL="https://hub.test" и OPENCODE_CORP_CONFIG,
      равный содержимому файла; модуль корп-констант возвращает эти значения

  - id: AC-04
    rule: [S-C2, S-C6]
    type: unit
    given: сборка без CORP_HUB_URL и без корп-конфига
    when: прочитаны корп-константы в рантайме
    then: обе константы не определены, модуль возвращает undefined, ошибок нет

  - id: AC-05
    rule: [S-C3]
    type: unit
    given: >
      корп-слой задаёт model=magnit_prod/MagnitCopilot и autoupdate=false; well-known Hub задаёт
      model=other/X; глобальный конфиг пользователя задаёт model=user/Y
    when: конфиг собран через loadInstanceState
    then: >
      действует model=user/Y (глобальный выше well-known выше корп-слоя); autoupdate=false из
      корп-слоя сохраняется, так как его никто не переопределил

  - id: AC-06
    rule: [S-C3]
    type: unit
    given: OPENCODE_CORP_CONFIG содержит синтаксически неверный JSON
    when: собирается конфиг
    then: загрузка конфига не падает, корп-слой пуст, в лог записано предупреждение
    negative: true

  - id: AC-07
    rule: [S-C4, S-C4a, S-C4b]
    type: unit
    given: файл corp/config/opencode.corp.json
    when: он провалидирован схемой конфига OpenCode
    then: >
      валиден; содержит autoupdate=false, share="disabled", enabled_providers=["magnit_prod"],
      model="magnit_prod/MagnitCopilot" и провайдера magnit_prod
      (npm="@ai-sdk/openai-compatible", модель MagnitCopilot с limit.context>0 и limit.output>0)
      с options.baseURL="https://llmlite.ailab-copilot-prod.corp.tander.ru/v1";
      ключ options.apiKey у провайдера отсутствует (значение undefined), в тексте файла нет подстрок
      "apiKey", "MAGNIT_COPILOT_KEY" и "copilot.magnit.ru";
      не содержит ни одного секрета (нет ключей, токенов, паролей)

  - id: AC-08
    rule: [S-C5]
    type: unit
    given: заданы build-константа OPENCODE_CORP_HUB_URL=https://build.test и переменная окружения OPENCODE_CORP_HUB_URL=https://env.test
    when: вычислен действующий адрес Hub без флага --hub
    then: используется https://env.test; при передаче --hub https://flag.test используется https://flag.test

  - id: AC-09
    rule: [S-C5]
    type: integration
    given: адрес Hub не задан ни константой, ни переменной окружения
    when: вызван GET /corp/catalog
    then: ответ 501 {"error":"corp_disabled"}; команда /connectors в палитре отсутствует
    negative: true

  - id: AC-10
    rule: [S-C6]
    type: integration
    given: ванильная сборка (корп-константы отсутствуют), пустой auth-store
    when: запущен TUI
    then: >
      автоматически открывается upstream DialogProviderList; корп-экран входа не появляется;
      слэш-команд connectors и login нет

  - id: AC-11
    rule: [S-C7]
    type: unit
    given: корп-слой конфигурации активен
    when: приложение проработало без действий витрины
    then: файл глобального конфига пользователя не изменён (побайтово)

  - id: AC-12
    rule: [S-C7]
    type: unit
    given: витрина выполнила «Подключить» для alias gitlab
    when: сравнён глобальный конфиг до и после
    then: изменился только раздел mcp.gitlab; прочие ключи и комментарии (.jsonc) сохранены

  - id: AC-13
    rule: [S-C8, S-B6]
    type: ci
    given: PR с изменением файла upstream
    when: проверен список коммитов и corp/patches.md
    then: >
      каждый коммит, меняющий upstream-файл, имеет заголовок с префиксом `corp: `,
      и файл упомянут в corp/patches.md со ссылкой на правило спецификации

  # ---------------------------------------------------------------- S-A*: вход по SSO
  - id: AC-14
    rule: [S-A1]
    type: integration
    given: корп-функции включены
    when: запрошены корп-роуты входа
    then: >
      доступны POST /corp/login/start, GET /corp/login/poll/:id,
      POST /corp/login/poll/:id/team, GET /corp/status с описанными в спецификации схемами ответов

  - id: AC-15
    rule: [S-A2]
    type: unit
    given: мок Hub возвращает POST /cli/start → {login_id, poll_secret, browser_url, user_code, expires_in}
    when: вызван POST /corp/login/start
    then: >
      ответ содержит login_id, user_code, browser_url, expires_in и НЕ содержит poll_secret;
      poll_secret отсутствует в логах и событиях

  - id: AC-16
    rule: [S-A2]
    type: unit
    given: сессия входа создана
    when: вызван GET /corp/login/poll/:id
    then: исходящий запрос к Hub содержит заголовок X-Hub-Poll-Secret с сохранённым значением

  - id: AC-17
    rule: [S-A3]
    type: unit
    given: мок Hub отдаёт {status:"ready", key:"sk-test", key_kind:"persistent", user:{user_id:"u1",email:"u@m.ru"}}
    when: клиент дождался ready
    then: >
      Auth.set вызван для magnit_prod с {type:"api", key:"sk-test"} и metadata с hub/key_kind/user_id;
      сессия входа удалена из памяти; повторный poll даёт ошибку login_expired

  - id: AC-18
    rule: [S-A3]
    type: integration
    given: вход завершён успешно
    when: пользователь отправляет сообщение
    then: провайдер magnit_prod активен без перезапуска приложения

  - id: AC-19
    rule: [S-A4]
    type: unit
    given: мок Hub на poll отвечает 502 litellm_unavailable четыре раза подряд, затем ready
    when: выполняется опрос
    then: опрос не прекращается, вход завершается успешно; интервал между запросами ≥ 2 с

  - id: AC-20
    rule: [S-A4]
    type: unit
    given: мок Hub на poll отвечает 502 пять раз подряд
    when: выполняется опрос
    then: опрос прекращается, наружу отдаётся ошибка hub_unavailable
    negative: true

  - id: AC-21
    rule: [S-A4, S-A5]
    type: unit
    given: мок Hub отвечает 404 {"error":"login_expired"}
    when: выполняется опрос
    then: опрос прекращается немедленно, наружу код login_expired и русское сообщение
    negative: true

  - id: AC-22
    rule: [S-A5]
    type: unit
    given: 'мок Hub отвечает 429 {"error":"rate_limited"} с Retry-After: 30'
    when: вызван POST /corp/login/start
    then: наружу код rate_limited с указанием времени ожидания; тело ответа Hub не пересылается дословно
    negative: true

  - id: AC-23
    rule: [S-A5]
    type: unit
    given: мок Hub отвечает 502 {"error":"litellm_invalid_response"}
    when: выполняется опрос
    then: наружу код litellm_invalid_response и русское сообщение из словаря
    negative: true

  - id: AC-24
    rule: [S-A6]
    type: manual
    given: корп-экран входа открыт
    when: получен ответ /cli/start
    then: >
      на экране виден user_code, ссылка browser_url, состояние «Ожидание подтверждения…»;
      браузер открыт автоматически; доступны «Скопировать код» и «Отмена»

  - id: AC-25
    rule: [S-A6]
    type: integration
    given: мок Hub отвечает {status:"team_selection_required", teams:[{team_id:"t1",team_alias:"A"},{team_id:"t2",team_alias:"B"}]}
    when: экран получил ответ
    then: >
      показан список из двух команд с названиями A и B; выбор отправляет
      POST /corp/login/poll/:id/team {team_id:"t2"}; экран возвращается к ожиданию

  - id: AC-26
    rule: [S-A6]
    type: integration
    given: выбрана команда, мок Hub отвечает 400 {"error":"invalid_team"}
    when: получен ответ
    then: показана ошибка invalid_team, список команд остаётся, вход не считается завершённым
    negative: true

  - id: AC-27
    rule: [S-A7]
    type: integration
    given: корп-функции включены, auth-store пуст
    when: TUI завершил синхронизацию и список провайдеров пуст
    then: автоматически открыт корп-экран входа, а не DialogProviderList

  - id: AC-28
    rule: [S-A7]
    type: integration
    given: корп-функции включены, в auth-store есть запись magnit_prod
    when: запущено приложение
    then: корп-экран входа не открывается автоматически

  - id: AC-29
    rule: [S-A8]
    type: integration
    given: пользователь уже вошёл
    when: выполнена слэш-команда /login
    then: открыт корп-экран входа; после успеха запись magnit_prod в auth-store перезаписана новым ключом

  - id: AC-30
    rule: [S-A9]
    type: integration
    given: корп-экран входа в состоянии ожидания
    when: нажат esc
    then: >
      экран закрыт, опрос прекращён, сессия входа удалена из памяти сервера,
      auth-store не изменён
    negative: true

  - id: AC-31
    rule: [S-A10]
    type: integration
    given: мок Hub с полным успешным флоу и одной командой
    when: выполнено `opencode corp login --hub <мок>`
    then: >
      напечатаны адрес, код и ссылка; после ready напечатан email и key_kind;
      ключ сохранён; код выхода 0

  - id: AC-32
    rule: [S-A10]
    type: integration
    given: мок Hub возвращает две команды, ввод неинтерактивен
    when: выполнено `opencode corp login`
    then: печатается ошибка с подсказкой указать --team <id>, код выхода 1
    negative: true

  - id: AC-33
    rule: [S-A11, S-A11a]
    type: integration
    given: ключ magnit_prod отсутствует, мок Hub отвечает на /health
    when: выполнено `opencode corp status --hub <мок>`
    then: >
      вывод содержит подстроки «Hub: <адрес мока>», «Доступность Hub: доступен (ok)»,
      «Корпоративный ключ: нет» и строку, начинающуюся с «Каталог: »; код выхода 1.
      Проверка выполняется по подстрокам в точных формулировках таблицы S-A11a (регистр значим);
      ожидаемые подстроки берутся cli.test.ts и дымовой проверкой corp-ci.yml из одного источника,
      расхождение формулировок между ними считается дефектом (см. BUG-I4-001)
    negative: true

  - id: AC-34
    rule: [S-A11]
    type: integration
    given: ключ есть, мок Hub отвечает на /api/me и /health
    when: выполнено `opencode corp status`
    then: >
      напечатаны адрес, user_id/email, key_kind, версия каталога и время кэша;
      сам ключ в выводе отсутствует; код выхода 0

  - id: AC-35
    rule: [S-A11, S-A11a]
    type: integration
    given: ключ magnit_prod есть, Hub недоступен (мок отвечает сетевой ошибкой)
    when: выполнено `opencode corp status`
    then: >
      вывод содержит «Доступность Hub: недоступен» и «Корпоративный ключ: есть»; строка «Каталог: »
      заполнена из локального кэша (или «Каталог: кэша нет»); сам ключ в выводе отсутствует;
      код выхода 0 — недоступность Hub на код выхода не влияет (S-A11)
    negative: true

  - id: AC-36
    rule: [S-A12]
    type: integration
    given: собранный бинарник
    when: выполнено `opencode corp`
    then: напечатана справка с подкомандами login и status; без подкоманды команда не выполняет действий

  - id: AC-37
    rule: [S-A12, S-C5]
    type: integration
    given: корп-функции выключены
    when: выполнено `opencode corp login`
    then: напечатано «Корпоративный режим не настроен», код выхода 1
    negative: true

  # ---------------------------------------------------------------- S-V*: витрина (логика)
  - id: AC-38
    rule: [S-V1]
    type: integration
    given: корп-функции включены и ключ есть
    when: запрошены корп-роуты витрины
    then: >
      доступны GET /corp/catalog, POST /corp/connectors/:alias/connect,
      POST /corp/connectors/:alias/disconnect, PUT /corp/connectors/:alias/permissions

  - id: AC-39
    rule: [S-V2]
    type: unit
    given: мок Hub GET /api/catalog отвечает 200 корректным телом
    when: вызван клиент Hub
    then: >
      запрос содержит Authorization: Bearer <ключ> и X-Request-ID;
      таймаут запроса 5 с; карточки разобраны в модель

  - id: AC-40
    rule: [S-V2, S-V14]
    type: unit
    given: >
      мок Hub GET /api/catalog отвечает 200 телом с корректным конвертом, в servers — одна карточка
      без обязательного поля alias
    when: вызван клиент Hub
    then: >
      карточка без alias отброшена и пользователю не показывается; ошибки hub_invalid_response нет,
      остальные карточки ответа приняты и записаны в кэш (отбрасывание всего ответа при нарушенном
      конверте — AC-160)
    negative: true

  - id: AC-41
    rule: [S-V2]
    type: unit
    given: мок Hub не отвечает дольше 5 с
    when: вызван клиент Hub
    then: запрос прерван по таймауту, возвращена ошибка hub_unavailable
    negative: true

  - id: AC-42
    rule: [S-V3]
    type: unit
    given: успешный ответ каталога
    when: выполнен GET /corp/catalog
    then: >
      source="hub"; файл кэша создан по пути Global.Path.data/corp/catalog-<hash>.json
      с правами 0o600 и содержит hub_url, fetched_at, version, servers

  - id: AC-43
    rule: [S-V3]
    type: unit
    given: кэш возрастом 1 ч, Hub отвечает сетевой ошибкой
    when: выполнен GET /corp/catalog
    then: source="cache", stale=false, карточки из кэша, поле hub_error заполнено
    negative: true

  - id: AC-44
    rule: [S-V3]
    type: unit
    given: кэш возрастом 25 ч (подменяемые часы), Hub недоступен
    when: выполнен GET /corp/catalog
    then: source="cache", stale=true; карточки отдаются; действия «Подключить» и «Права» помечены недоступными
    negative: true

  - id: AC-45
    rule: [S-V3]
    type: unit
    given: кэша нет, Hub недоступен
    when: выполнен GET /corp/catalog
    then: servers=[], stale=true, hub_error заполнен
    negative: true

  - id: AC-46
    rule: [S-V3]
    type: unit
    given: файл кэша повреждён (не JSON)
    when: выполнен GET /corp/catalog при недоступном Hub
    then: кэш трактуется как отсутствующий, ошибки чтения не выбрасываются наружу
    negative: true

  - id: AC-47
    rule: [S-V3]
    type: unit
    given: два разных адреса Hub
    when: каталоги обоих закэшированы
    then: файлы кэша различны, данные не смешиваются

  - id: AC-48
    rule: [S-V4]
    type: integration
    given: ключ magnit_prod отсутствует
    when: выполнен GET /corp/catalog
    then: servers=[], hub_error="unauthorized"; витрина показывает «Требуется вход» с действием «Войти»
    negative: true

  - id: AC-49
    rule: [S-V5]
    type: unit
    given: карточка каталога, запись mcp.<alias> в конфиге и локальный статус MCP
    when: вычислена модель карточки
    then: модель содержит title, description, owner, docs_url, mode, пресет, статус витрины и признак deprecated

  - id: AC-50
    rule: [S-V6]
    type: unit
    given: alias есть в конфиге, но отсутствует в ответе каталога
    when: вычислен статус
    then: статус unavailable; доступны только «Отключить» и «Открыть в Hub»
    negative: true

  - id: AC-51
    rule: [S-V6, S-V15, S-V16]
    type: unit
    given: >
      локальный статус MCP = failed с текстом ошибки — в двух вариантах: (а) подключение к этому alias
      никогда не состоялось (признак S-V15 ложен, записи подключения у Hub нет) и (б) подключение
      состоялось раньше (признак S-V15 истинен);
      ревизия 1.9: прежняя редакция требовала одного набора действий «Переподключить» и «Отключить»
      на оба случая, из-за чего «Отключить» показывалось серверу, который пользователь никогда не
      подключал (BUG-I4-010)
    when: вычислен статус
    then: >
      в обоих вариантах статус unavailable и подпись содержит текст ошибки (проверки прежней редакции
      сохранены дословно); в варианте (а) единственное действие управления подключением —
      «Подключить», действия «Отключить» и «Убрать из списка» отсутствуют; в варианте (б) действия —
      «Повторить» и «Убрать из списка», действие «Отключить» отсутствует
    negative: true

  - id: AC-52
    rule: [S-V6]
    type: unit
    given: локальный статус needs_auth (и отдельно needs_client_registration, и отдельно connection.status=needs_reauth)
    when: вычислен статус
    then: во всех трёх случаях статус needs_auth с действием повторной авторизации

  - id: AC-53
    rule: [S-V6]
    type: unit
    given: локальный статус connected
    when: вычислен статус
    then: статус connected; доступны «Права», «Отключить», «Открыть в Hub»

  - id: AC-54
    rule: [S-V6]
    type: unit
    given: mcp.<alias> есть в конфиге, локальный статус disabled
    when: вычислен статус
    then: статус not_connected с действием «Подключить»

  - id: AC-55
    rule: [S-V6]
    type: unit
    given: alias есть в каталоге, отсутствует в конфиге
    when: вычислен статус
    then: статус not_connected с действиями «Подключить» и «Открыть в Hub»

  - id: AC-56
    rule: [S-V6]
    type: unit
    given: карточка со status=deprecated, alias отсутствует в конфиге
    when: вычислена модель карточки
    then: показан бейдж «устаревший», действие «Подключить» недоступно
    negative: true

  - id: AC-57
    rule: [S-V7]
    type: unit
    given: карточка gitlab, mode=facade, mcp_url=https://hub.test/mcp/gitlab, пресет readonly
    when: выполнено «Подключить»
    then: >
      Config.updateGlobal получил патч
      mcp.gitlab={type:"remote", url:"https://hub.test/mcp/gitlab", enabled:true, oauth:{scope:"gitlab:readonly"}};
      затем вызван POST /mcp/gitlab/auth/authenticate

  - id: AC-58
    rule: [S-V7, D-5]
    type: unit
    given: >
      карточка native-коннектора (alias=native_srv, mode=native, permission_model.kind=consent);
      ревизия 1.7: alias tag в этом критерии заменён, потому что в действующем каталоге Hub tag —
      mode=facade с моделью прав tool_filter (AC-164), а проверяемое поведение относится к mode=native
    when: выполнено «Подключить»
    then: патч конфига не содержит ключа oauth; далее вызван POST /mcp/native_srv/auth/authenticate

  - id: AC-59
    rule: [S-V7]
    type: integration
    given: OAuth завершился отказом пользователя на стороне Hub
    when: authenticate вернул ошибку
    then: >
      запись mcp.<alias> остаётся в конфиге, статус карточки needs_auth,
      показано сообщение об ошибке, повтор доступен одним действием
    negative: true

  - id: AC-60
    rule: [S-V7]
    type: integration
    given: браузер открыть не удалось (событие BrowserOpenFailed)
    when: выполнено «Подключить»
    then: показан URL авторизации текстом с предложением открыть вручную; ожидание callback продолжается
    negative: true

  - id: AC-61
    rule: [S-V7]
    type: integration
    given: пресет не выбран явно
    when: выполнено «Подключить» для facade-сервера
    then: использован пресет readonly

  - id: AC-62
    rule: [S-V8]
    type: unit
    given: подключённый сервер gitlab
    when: выполнено «Отключить»
    then: >
      вызваны по порядку DELETE /mcp/gitlab/auth, POST /mcp/gitlab/disconnect,
      Config.updateGlobal с mcp.gitlab.enabled=false, DELETE {hub}/api/me/connections/gitlab;
      запись mcp.gitlab из конфига не удалена

  - id: AC-63
    rule: [S-V8]
    type: unit
    given: Hub отвечает 502 на DELETE /api/me/connections/gitlab
    when: выполнено «Отключить»
    then: локальные три шага выполнены, статус карточки not_connected, показано предупреждение
    negative: true

  - id: AC-64
    rule: [S-V9]
    type: unit
    given: подключённый facade-сервер с пресетом readonly
    when: выбран пресет readwrite и подтверждён
    then: >
      вызван PUT {hub}/api/me/connections/gitlab/permissions {preset:"readwrite"};
      Config.updateGlobal записал oauth.scope="gitlab:readwrite";
      при reauth_required=true запущена повторная авторизация

  - id: AC-65
    rule: [S-V9]
    type: unit
    given: подключённый native-сервер (alias=native_srv, mode=native)
    when: выбран другой пресет
    then: >
      локальный oauth.scope не появляется и не меняется; вызван PUT прав в Hub;
      повторная авторизация проходит через экран согласия сервера

  - id: AC-66
    rule: [S-V9]
    type: integration
    given: открыт экран выбора прав
    when: пользователь нажал «Отмена»
    then: конфиг не изменён, запрос к Hub не отправлен, пресет карточки прежний
    negative: true

  - id: AC-67
    rule: [S-V9]
    type: unit
    given: карточка с permission_model.kind=header_groups
    when: открыт экран прав
    then: показаны пресеты readonly/readwrite и состав групп (title + preset) вместе с always

  - id: AC-68
    rule: [S-V10]
    type: integration
    given: карточка alias=gitlab и hub_url=https://hub.test
    when: выполнено «Открыть в Hub»
    then: открыт https://hub.test/ui/servers/gitlab; при неудаче открытия URL показан текстом

  - id: AC-69
    rule: [S-V11]
    type: unit
    given: каталог из пяти карточек двух владельцев
    when: введён поисковый запрос в другом регистре, совпадающий с частью description
    then: отфильтрованы только совпавшие карточки; порядок и группировка по owner соответствуют порядку каталога

  - id: AC-70
    rule: [S-V12]
    type: integration
    given: Hub ответил 200 с servers=[]
    when: открыта витрина
    then: показано состояние «Каталог пуст» с действием «Обновить» (не путается с «Hub недоступен»)
    negative: true

  - id: AC-71
    rule: [S-V13]
    type: integration
    given: в кэше каталога есть карточка gitlab с title "GitLab (coderepo...)"
    when: открыт upstream-диалог /mcps
    then: рядом с alias gitlab показан человеческий title; поведение тумблера не изменилось

  - id: AC-72
    rule: [S-V13]
    type: integration
    given: кэш каталога отсутствует
    when: открыт /mcps
    then: список выглядит и работает как в upstream

  # ---------------------------------------------------------------- S-T*: TUI
  - id: AC-73
    rule: [S-T1]
    type: integration
    given: корп-функции включены
    when: в TUI введено /connectors (и отдельно открыта палитра команд)
    then: открывается витрина; команда присутствует в палитре с русским названием

  - id: AC-74
    rule: [S-T2]
    type: integration
    given: ключ magnit_prod отсутствует
    when: открыта палитра команд
    then: команда входа присутствует и помечена как предлагаемая (suggested)

  - id: AC-75
    rule: [S-T3]
    type: integration
    given: корп-функции включены, провайдеров нет
    when: сработал first-run эффект
    then: открыт DialogCorpLogin; при выключенных корп-функциях в том же сценарии — DialogProviderList

  - id: AC-76
    rule: [S-T4]
    type: integration
    given: открыт корп-экран входа
    when: выбрано «Другой провайдер»
    then: открыт upstream DialogProviderList без изменений в его поведении

  - id: AC-77
    rule: [S-T5]
    type: integration
    given: открыт upstream-список провайдеров, корп-функции включены
    when: выбран провайдер magnit_prod
    then: открыт корп-экран входа, а не ввод API-ключа; выбор любого другого провайдера работает как в upstream

  - id: AC-78
    rule: [S-T6]
    type: integration
    given: витрина TUI открыта с четырьмя карточками разных статусов
    when: отрисован список
    then: >
      статусы отображены цветами темы (connected — success, needs_auth — warning,
      not_connected — textMuted, unavailable — error); доступен штатный поиск

  - id: AC-79
    rule: [S-T6]
    type: integration
    given: каталог отдан из кэша с hub_error
    when: витрина открыта
    then: над списком показан баннер «Hub недоступен, данные от <дата>»
    negative: true

  - id: AC-80
    rule: [S-T7]
    type: integration
    given: витрина TUI, карточка not_connected
    when: нажат enter
    then: >
      запущен MCP-OAuth (браузер открыт), карточка показывает «Авторизация в браузере»,
      после callback статус обновляется на connected

  - id: AC-81
    rule: [S-T7]
    type: integration
    given: одно подключение уже выполняется
    when: пользователь запускает второе
    then: второе действие игнорируется до завершения первого
    negative: true

  - id: AC-82
    rule: [S-T8]
    type: integration
    given: корп-экран входа TUI в состоянии ожидания
    when: нажата клавиша c
    then: user_code скопирован в буфер обмена, показано подтверждение

  - id: AC-83
    rule: [S-T9]
    type: integration
    given: корп-сборка
    when: выполнены /mcps, /connect, /status, /models, /agents
    then: все команды работают как в upstream, их слэш-имена не изменились

  # ---------------------------------------------------------------- S-D*: Desktop и web
  - id: AC-84
    rule: [S-D1]
    type: integration
    given: Desktop-сборка с включёнными корп-функциями
    when: в палитре команд введено connectors
    then: команда найдена и открывает витрину; при выключенных корп-функциях команда отсутствует

  - id: AC-85
    rule: [S-D2]
    type: unit
    given: роутер приложения
    when: проверен список маршрутов
    then: маршрут /connectors не добавлен; порядок upstream-маршрутов не изменён

  - id: AC-86
