    when: вызван клиент Hub и открыта витрина
    then: >
      в обоих случаях ошибки hub_invalid_response нет, карточка показана, кэш перезаписан;
      значение version отдано наружу (/corp/catalog, catalog_version в /corp/status) и записано в
      кэш строкой "1" — форма пришедшего значения на состав витрины не влияет

  - id: AC-169
    rule: [S-V14, S-V2]
    type: unit
    given: >
