      {"connections": […]} и строка)
    when: вызван клиент Hub
    then: >
      в каждом случае возвращена ошибка hub_invalid_response; ответ с массивом верхнего уровня,
      один элемент которого не разобран по ядру, ошибки не даёт — этот элемент отброшен, остальные
