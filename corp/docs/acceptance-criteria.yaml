  # -------------------------- ревизия 1.9: состояния витрины, каталог кеша, апгрейд CLI, заголовок окна (BUG-I4-010)

  - id: AC-170
    rule: [S-V15, S-V16, S-V6]
    type: unit
    given: >
      alias есть в каталоге Hub, connection отсутствует, признак «подключение состоялось» ложен,
      локальный статус отсутствует либо disabled
    when: вычислена модель карточки
    then: >
      состояние «Не подключён»; единственное действие управления подключением — «Подключить»;
      действий «Отключить», «Повторить» и «Убрать из списка» в карточке нет; «Открыть в Hub» доступно

  - id: AC-171
    rule: [S-V16, S-V6]
    type: unit
    given: >
      alias, к которому пользователь никогда не подключался (признак S-V15 ложен, connection у Hub
      отсутствует), запись mcp.<alias> в конфиге есть — её создал шаг 1 S-V7 перед авторизацией,
      локальный статус needs_auth (и отдельно needs_client_registration)
    when: вычислена модель карточки
    then: >
      в обоих случаях статус needs_auth, состояние «Подключение не удалось», единственное действие
      управления подключением — «Подключить»; действие «Отключить» отсутствует — именно оно
      показывалось в BUG-I4-010; «Убрать из списка» тоже отсутствует
    negative: true

  - id: AC-172
    rule: [S-V16, S-V19]
    type: integration
    given: >
      пользователь нажал «Подключить» на сервере, к которому никогда не подключался, и авторизация
      завершилась ошибкой
    when: карточка перестроена после неудачной попытки
    then: >
      запись mcp.<alias> в конфиге осталась (S-V7 п.4), признак «подключение состоялось» НЕ выставлен,
      карточка показывает объяснение ошибки и предлагаемое действие, набор действий — только
      «Подключить» и «Открыть в Hub»; слово «Отключить» на карточке не появляется ни в каком виде
    negative: true

  - id: AC-173
    rule: [S-V15, S-V16]
    type: unit
    given: >
      alias, для которого признак «подключение состоялось» истинен (локальный статус connected
      наблюдался ранее), сейчас локальный статус failed с текстом ошибки
    when: вычислена модель карточки
    then: >
      состояние «Соединение потеряно»; действия — «Повторить» и «Убрать из списка»; действия
      «Отключить» нет; «Открыть в Hub» доступно; подпись содержит текст ошибки

  - id: AC-174
    rule: [S-V16, S-V15]
    type: unit
    given: карточка каталога с connection.status = needs_reauth, локальной истории подключений нет
    when: вычислена модель карточки
    then: >
      признак «подключение состоялось» истинен (запись подключения Hub создаётся только после успешной
      авторизации), состояние «Соединение потеряно», действия — «Повторить» и «Убрать из списка»,
      статус карточки needs_auth (AC-52 не изменён)

  - id: AC-175
    rule: [S-V17]
    type: unit
    given: подключавшийся ранее сервер gitlab в состоянии «Соединение потеряно»
    when: выполнено «Убрать из списка» и подтверждено
    then: >
      вызваны по порядку DELETE /mcp/gitlab/auth, POST /mcp/gitlab/disconnect, Config.updateGlobal с
      УДАЛЕНИЕМ ключа mcp.gitlab (а не enabled=false), DELETE {hub}/api/me/connections/gitlab;
      alias удалён из файла признака подключений; прочие ключи конфига пользователя не изменены;
      карточка перешла в состояние «Не подключён» и осталась в витрине

  - id: AC-176
    rule: [S-V17]
    type: unit
    given: Hub недоступен (таймаут) на шаге DELETE /api/me/connections/gitlab
    when: выполнено «Убрать из списка»
    then: >
      локальные шаги выполнены, ключ mcp.gitlab из конфига удалён, признак подключения снят,
      ответ содержит hub_error, показано предупреждение; локальные шаги не откачены
    negative: true

  - id: AC-177
    rule: [S-V18, S-V16, S-V8]
    type: unit
    given: локальный статус connected
    when: отрисована карточка витрины
    then: >
      признак подключения — положительный и отдельный, а не отсутствие кнопки, и не подпись статуса
      мелким вспомогательным шрифтом; ревизия 1.10 требует конкретного места: ячейка колонки «Статус»
      содержит текст состояния и цветовую точку семантического токена темы, бейджа «Подключено» на
      витрине больше нет; кнопки «Подключить» у подключённого нет; набор действий — «Отключить»,
      «Права», «Открыть в Hub» (AC-53 не изменён), предъявляются они на странице коннектора (S-D11)

  - id: AC-178
    rule: [S-V15, S-V8]
    type: unit
    given: >
      alias был подключён (признак выставлен и записан в файл), затем выполнено «Отключить» (S-V8),
      затем приложение перезапущено
    when: открыта витрина и вычислена модель карточки
    then: >
      признак «подключение состоялось» по-прежнему истинен — «Отключить» его не снимает и перезапуск
      его не теряет; карточка показывает подпись «Отключено вами» (не «Соединение потеряно») и
      действия «Повторить» и «Убрать из списка»; действия «Отключить» на ней нет

  - id: AC-179
    rule: [S-V15]
    type: unit
    given: >
      файл признака подключений отсутствует или повреждён, каталог Hub отдаёт карточку с
      connection.status = connected
    when: вычислен признак «подключение состоялось»
    then: >
      признак истинен по данным Hub; повреждённый файл трактуется как отсутствующий, витрина
      открывается, ошибка чтения записана в лог; при отсутствии и файла, и connection признак ложен
    negative: true

  - id: AC-180
    rule: [S-V19]
    type: unit
    given: >
      подключение завершилось отказом авторизации (OAuth invalid_grant; отдельно 401 от MCP-прокси
      Hub; отдельно JSON-RPC error.data.reason = needs_reauth)
    when: сформирован ответ POST /corp/connectors/:alias/connect и перестроена карточка
    then: >
      во всех трёх случаях error_class = token_rejected; пользователю показано объяснение «авторизация
      не принята» и предложено повторить авторизацию, дополнительно «Открыть в Hub»; тело ответа Hub,
      ключ и poll_secret в тексте отсутствуют
    negative: true

  - id: AC-181
    rule: [S-V19]
    type: unit
    given: >
      Hub отказал в регистрации клиента (DCR) либо локальный статус needs_client_registration
    when: сформирован ответ connect
    then: >
      error_class = method_unavailable; показано объяснение, что этим способом коннектор подключить
      нельзя, и предложено «Открыть в Hub»; действие «Повторить авторизацию» первичным не предлагается
    negative: true

  - id: AC-182
    rule: [S-V19]
    type: unit
    given: подключение не удалось из-за сети или сервера (таймаут, сетевая ошибка, 502, hub_invalid_response)
    when: сформирован ответ connect
    then: >
      error_class = hub_unreachable — идентификатор класса не изменён; показано источник-нейтральное
      объяснение, что связаться с сервисом не удалось и настройки пользователя ни при чём (слова
      «Hub» в нём нет: класс достижим у native-карточки в сборке без Hub); предложено «Повторить»
    negative: true

  - id: AC-183
    rule: [S-V19]
    type: unit
    given: подключение завершилось ошибкой, не отнесённой ни к одному из трёх классов
    when: сформирован ответ connect
    then: >
      error_class = unknown; карточка всё равно показывает текст с кодом ошибки и предлагаемое
      действие «Повторить»; состояния «ошибка без объяснения» не существует ни при какой ошибке
    negative: true

  - id: AC-184
    rule: [S-D10, S-Q9]
    type: unit
    given: >
      витрина открыта в обеих ветках флага «New layout and designs» с нулём карточек, с одной
      карточкой и с полусотней карточек
    when: измерена высота видимой панели окна
    then: >
      высота одинакова во всех трёх случаях внутри одной ветки и совпадает с высотой окна настроек той
      же ветки; появление баннера «Hub недоступен», предупреждения об отброшенных карточках,
      переключение вкладок и любое из ПЯТИ пустых состояний (S-V12, ревизия 1.12) высоту не меняют;
      список прокручивается внутри окна; окну не передан fit; то же требование выполняется для
      страницы коннектора и экрана разрешений (S-D10, S-D11) — их высота не зависит ни от длины
      описания, ни от числа групп разрешений

  - id: AC-185
    rule: [S-T10, S-V16]
    type: unit
    given: те же входы, что в AC-170, AC-171, AC-173 и AC-177, поданы экрану витрины TUI
    when: построен список коннекторов
    then: >
      TUI показывает те же четыре состояния и те же наборы действий, что Desktop, взяв их из общего
      модуля corp/status.ts; подпись действия в состоянии «Соединение потеряно» — «Повторить»,
      в состояниях «Не подключён» и «Подключение не удалось» — «Подключить»; подключённая карточка
      помечена маркером, читаемым без цвета

  - id: AC-186
    rule: [S-T10]
    type: unit
    given: карточка TUI в состоянии «Не подключён», «Подключение не удалось» и «Соединение потеряно»
    when: нажата клавиша d («Отключить»)
    then: >
      ни в одном из трёх состояний отключение не выполняется, конфиг не меняется, показана подсказка,
      что подключения нет; клавиша x («Убрать из списка») действует только в состоянии «Соединение
      потеряно»
    negative: true

  - id: AC-187
    rule: [S-I1, S-I3, S-V19]
    type: unit
    given: словари packages/app/src/i18n/en.ts и ru.ts и словарь TUI
    when: выполнен тест паритета
    then: >
      ключи corp.connectors.connected, corp.connectors.retry, corp.connectors.forget,
      corp.connectors.forgetConfirm, corp.connectors.forgetHubFailed, corp.connectors.neverConnected,
      corp.connectors.lost, corp.connectors.disconnected, corp.error.connect.token_rejected, corp.error.connect.method_unavailable,
      corp.error.connect.hub_unreachable, corp.error.connect.unknown и corp.upgrade.disabled есть в
      обоих словарях, значения ru не равны значениям en, те же тексты есть в словаре TUI

  - id: AC-188
    rule: [S-Q4, S-Q9, S-V15, S-V16]
    type: unit
    given: тесты витрины packages/opencode/src/corp/connectors.test.ts и status.test.ts
    when: тесты выполнены
    then: >
      покрыта каждая строка таблицы S-V16, причём для состояний «Подключение не удалось» и «Соединение
      потеряно» — парой случаев с ОДИНАКОВЫМ локальным статусом и разным признаком S-V15; ни в одном
      случае состояний 1–3 набор действий не содержит disconnect; покрыты выставление признака по
      локальному connected и по connection.status Hub, его сохранение при «Отключить» и снятие при
      «Убрать из списка»

  - id: AC-189
    rule: [S-B13, S-B9]
    type: unit
    given: packages/desktop/electron-builder.config.ts, OPENCODE_CHANNEL=magnit
    when: вычислена конфигурация упаковки
    then: >
      extraMetadata.name = "opencode-magnit-desktop", extraMetadata.desktopName сохранён из getBase()
      (ai.opencode.desktop.magnit.desktop); проверки AC-138 (appId, productName, artifactName,
      rpm.packageName, protocols.name, отсутствие legacyDesktopEntryFpm) продолжают выполняться
      без изменений

  - id: AC-190
    rule: [S-B13, S-B9]
    type: unit
    given: OPENCODE_CHANNEL=dev, beta и prod
    when: вычислена конфигурация упаковки
    then: >
      extraMetadata каждого из трёх каналов совпадает с upstream-значением (только desktopName, поля
      name в нём нет), то есть каталог кеша обновлений ванильных каналов не изменился;
      правка ограничена веткой magnit (S-B9)

  - id: AC-191
    rule: [S-B13]
    type: manual
    given: собранная корпоративная сборка Desktop канала magnit с заданным CORP_DESKTOP_UPDATE_URL
    when: осмотрен app-update.yml в ресурсах бандла и каталоги кеша после запуска и проверки обновлений
    then: >
      app-update.yml содержит updaterCacheDirName: opencode-magnit-desktop-updater и не содержит
      подстроки @opencode-aidesktop-updater; в кеше ОС создан каталог opencode-magnit-desktop-updater;
      каталог @opencode-aidesktop-updater корпоративной сборкой не создан, не прочитан и не очищен

  - id: AC-192
    rule: [S-Q10, S-B13]
    type: unit
    given: тест конфигурации упаковки Desktop
    when: тест выполнен
    then: >
      к покрытию AC-152 добавлены случаи каталога кеша: extraMetadata.name канала magnit и
      неизменённый extraMetadata каналов dev, beta, prod; прежние случаи AC-152 (каналы, неизвестное
      значение, незаданная переменная, обе ветки фида обновлений) продолжают проверяться

  - id: AC-193
    rule: [S-B14]
    type: unit
    given: корп-функции включены, CORP_CLI_UPDATE_URL не задан, HTTP-клиент подменён перехватчиком
    when: выполнена команда opencode upgrade
    then: >
      не выполнено ни одного сетевого запроса (в частности к api.github.com, registry.npmjs.org,
      formulae.brew.sh, community.chocolatey.org, raw.githubusercontent.com) и не запущен ни один
      менеджер пакетов; напечатано сообщение corp.upgrade.disabled о централизованном обновлении;
      код выхода 1
    negative: true

  - id: AC-194
    rule: [S-B14]
    type: unit
    given: корп-функции включены, CORP_CLI_UPDATE_URL = https://dist.test/opencode
    when: выполнена команда opencode upgrade без явной цели
    then: >
      единственный запрос определения версии — GET https://dist.test/opencode/latest, ответ разобран
      как {version}; артефакт скачан с того же хоста; к api.github.com и публичным реестрам обращений
      нет ни на одном шаге; при совпадении версии с текущей апгрейд пропущен без сетевой установки

  - id: AC-195
    rule: [S-B14]
    type: unit
    given: корп-функции включены, адрес задан, ответ https://dist.test/opencode/latest не соответствует схеме
    when: выполнена команда opencode upgrade
    then: >
      напечатана понятная ошибка источника обновлений, бинарник не заменён, обращения к api.github.com
      как запасному источнику нет, код выхода 1
    negative: true

  - id: AC-196
    rule: [S-B14, S-Q11]
    type: unit
    given: корп-функции выключены (ванильная сборка, S-C6)
    when: выполнена команда opencode upgrade
    then: >
      поведение полностью upstream — версия определяется прежним путём, корп-сообщение не печатается,
      код выхода прежний

  - id: AC-197
    rule: [S-B15]
    type: unit
    given: упакованная сборка Desktop канала magnit
    when: создано главное окно
    then: >
      заголовок окна равен "OpenCode Magnit" — тому же значению, что APP_NAMES[CHANNEL] и productName
      канала; строки "OpenCode" без суффикса заголовок окна не содержит

  - id: AC-198
    rule: [S-B15]
    type: unit
    given: каналы dev, beta, prod и неупакованный запуск
    when: вычислен заголовок окна
    then: >
      заголовки равны "OpenCode Dev", "OpenCode Beta", "OpenCode" соответственно, неупакованный запуск
      даёт "OpenCode Dev"; заголовок берётся из той же таблицы имён и того же канала (resolveChannel →
      build-константа), второй копии разбора канала и второй таблицы имён в коде нет

  - id: AC-199
    rule: [S-Q11, S-Q10]
    type: unit
    given: тесты явного апгрейда CLI и заголовка окна
    when: тесты выполнены
    then: >
      список запрещённых хостов задан явно и проверяется по всем перехваченным запросам, а не по
      одному; покрыты обе ветки адреса апгрейда и ванильный режим; для заголовка окна покрыты все
      четыре канала и неупакованный запуск, а в packages/desktop/src/main/windows.ts нет литерала
      "OpenCode" в качестве значения title

  # ------------------------------------------- ревизия 1.10: словарь разрешений (S-V20)
  - id: AC-200
    rule: [S-V20]
    type: unit
    given: >
      карточка каталога с permission_groups {version:1, groups:[{id:"read_posts", title:"Читать
      сообщения и треды", description:"…", default:"allow", tools:["get_post","get_thread"]}],
      rest:{title:"Остальные возможности", description:"…", default:"ask"}}
    when: карточка разобрана
    then: >
      карточка принята; разобранная модель прав имеет вид permission_groups; группа доступна с id,
      title, description, default и списком инструментов в порядке каталога; блок rest разобран с
      default=ask

  - id: AC-201
    rule: [S-V20, S-V3]
    type: unit
    given: >
      карточка с permission_groups неизвестной клиенту версии (version:99) и с полем type, каталог
      успешно получен от Hub
    when: каталог записан в кэш и прочитан обратно
    then: >
      permission_groups и type сохранены в кэше ДОСЛОВНО, байт в байт как пришли от Hub, включая
      неизвестную версию; обеднённого представления в кэше нет (то же требование, что у
      permission_model, S-V3)

  - id: AC-202
    rule: [S-V20, S-V9]
    type: unit
    given: >
      карточка, у которой permission_groups не разобрался (groups не массив), но permission_model
      вида tool_filter разобран
    when: открыт экран разрешений
    then: >
      карточка не отброшена; показан прежний экран пресетов вида tool_filter (S-V9); пустого экрана и
      сообщения об ошибке разбора вместо экрана прав нет
    negative: true

  - id: AC-203
    rule: [S-V20, S-I6]
    type: unit
    given: словарь из трёх групп, у одной из них default вне перечисления allow|ask|deny
    when: словарь разобран
    then: >
      неразобранной оказывается только эта группа, её инструменты переходят в rest, две остальные
      группы работают, число выброшенных групп сообщено пользователю; русские title и description
      разобранных групп доходят до экрана без изменений — клиент их не переводит и не подменяет
    negative: true

  # ------------------------------------------- ревизия 1.10: экран разрешений (S-V9)
  - id: AC-204
    rule: [S-V9, S-D11]
    type: integration
    given: подключённый коннектор с permission_groups из пятнадцати групп
    when: открыт блок «Разрешения» на странице коннектора
    then: >
      показаны пятнадцать строк в порядке каталога плюс строка «Остальное» последней; в каждой строке
      title группы, её description и переключатель на три режима «Разрешить»/«Спрашивать»/«Запретить»;
      выбор режима доступен для каждой группы отдельно

  - id: AC-205
    rule: [S-V9, S-V23]
    type: integration
    given: экран разрешений, у групп разные режимы, групповой селектор показывает «Смешанно»
    when: в групповом селекторе выбрано «Запретить всё»
    then: >
      режим deny поставлен всем группам сразу, включая rest; конфиг перезаписан одним сохранением по
      S-V21, а не по группе за раз; значение «Смешанно» из селектора исчезло

  - id: AC-206
    rule: [S-V9]
    type: unit
    given: карточки видов header_groups, tool_filter и consent без permission_groups
    when: открыт экран разрешений каждой
    then: >
      показан прежний экран пресетов соответствующего вида (AC-67, AC-155…AC-157 не изменены);
      подтверждение по-прежнему уходит в Hub через PUT /api/me/connections/<alias>/permissions

  - id: AC-207
    rule: [S-V9]
    type: unit
    given: карточка, у которой нет ни permission_groups, ни разобранного permission_model
    when: открыт экран разрешений
    then: >
      выбор заблокирован, названа причина (модель прав не поддерживается этой версией приложения);
      «Открыть в Hub», «Подключить» и «Отключить» работают как обычно
    negative: true

  # ------------------------------------------- ревизия 1.10: применение разрешений (S-V21)
  - id: AC-208
    rule: [S-V21, S-Q4]
    type: unit
    given: >
      коннектор alias="tag-mcp", группа с инструментами ["get_post", "search posts"] в режиме allow
    when: разрешения сохранены
    then: >
      в permission появились ключи "tag-mcp_get_post" и "tag-mcp_search_posts" со значением "allow" —
      дефис в alias сохранён, недопустимый символ заменён на "_" тем же sanitize, которым именуются
      инструменты MCP

  - id: AC-209
    rule: [S-V21, S-Q4, S-Q13]
    type: unit
    given: словарь с rest.default=allow и одной группой в режиме deny
    when: разрешения сохранены и конфиг прочитан
    then: >
      первым ключом блока alias идёт wildcard "<alias>_*" со значением "allow", явные ключи
      инструментов группы — ПОСЛЕ него; проверка выполняется на порядке ключей блока и подтверждается
      результатом Permission.evaluate (AC-237), а не только составом ключей

  - id: AC-210
    rule: [S-V21, S-Q4]
    type: unit
    given: >
      конфиг, где уже есть блок alias от предыдущего сохранения (пять ключей), ключи другого
      коннектора, ключи edit и bash и wildcard "*"
    when: разрешения сохранены заново с другим набором режимов, у которого три ключа
    then: >
      выполнено ровно два вызова Config.updateGlobal — сначала удаление всех ключей ^<alias>_ через
      undefined, затем запись блока целиком; в конфиге не осталось ни одного ключа от предыдущего
      набора; ключи другого коннектора, edit, bash и "*" сохранены с прежним порядком относительно
      друг друга; блок alias лежит одним непрерывным участком

  - id: AC-211
    rule: [S-V21, S-Q4]
    type: unit
    given: >
      сервер отдаёт инструмент, не перечисленный ни в одной группе словаря, rest.default=ask
    when: разрешения сохранены и вычислен действующий режим этого инструмента
    then: >
      отдельного ключа инструменту не записано; Permission.evaluate даёт для него "ask" через
      wildcard; появление у сервера нового инструмента не может само по себе дать ему "allow"

  # AC-212 переформулирован по диспуту DISPUTE-I10-04-01 (резолюция:
  # corp/disputes/dispute-I10-04-permissions-cancel.resolution.json). Прежняя формулировка
  # предполагала у экрана шаг подтверждения и состояние «изменены, но не подтверждены», которых у
  # состава страницы по S-D11 п.5 нет: блок «Разрешения» — идиома экрана настроек (SelectV2
  # appearance="inline" + SettingsRowV2 с SegmentedControlV2), у которой выбор применяется сразу, и
  # того же требует S-V23 («Смешанно» исчезает, КАК ТОЛЬКО пользователь выбрал режим). Требование не
  # ослаблено: сохранено дословно «ни один вызов Config.updateGlobal, конфиг не изменён, запрос к Hub
  # не отправлен», и к нему добавлено более сильное — у этого вида запрос к Hub не отправляется ни
  # при каком действии экрана (D-35).
  - id: AC-212
    rule: [S-V21, S-V9, S-D11]
    type: integration
    given: >
      открыт экран разрешений вида permission_groups; ни один переключатель режима пользователь не
      трогал
    when: экран закрыт без выбора режима — esc либо «Назад»
    then: >
      ни один вызов Config.updateGlobal не выполнен, конфиг не изменён, запрос к Hub не отправлен
      (AC-66 распространяется на новый вид дословно); запись выполняется ТОЛЬКО выбором режима — в
      групповом селекторе или в переключателе строки, — а запрос к Hub у вида permission_groups не
      отправляется ни при каком действии экрана вовсе (D-35)
    negative: true

  # ------------------------------------------- ревизия 1.10: permission_state (S-V23)
  - id: AC-213
    rule: [S-V23, S-Q4]
    type: unit
    given: >
      группа из трёх инструментов; четыре конфига: все три allow, все три deny, все три ask, два
      allow и один deny
    when: сервер посчитал permission_state
    then: >
      получены соответственно allow, deny, ask и mixed; действующий режим каждого инструмента взят
      из Permission.evaluate по текущему конфигу, а не чтением ключа, поэтому правило-wildcard и
      вышележащие слои конфига учтены

  - id: AC-214
    rule: [S-V23]
    type: integration
    given: permission_state, в котором у части групп allow, у части ask
    when: открыт экран разрешений
    then: >
      групповой селектор показывает «Смешанно»; выбрать «Смешанно» нельзя — это только отображаемое
      значение; когда все группы имеют один режим, селектор показывает именно его

  # ------------------------------------------- ревизия 1.10: колонка «Тип» (S-V22)
  - id: AC-215
    rule: [S-V22]
    type: unit
    given: карточка с type="Мессенджер" и owner="AI Lab"
    when: отрисована строка витрины
    then: >
      колонка «Тип» показывает «Мессенджер»; значение взято из каталога как есть, клиент его не
      переводит и словаря типов не ведёт

  - id: AC-216
    rule: [S-V22, S-Q4]
    type: unit
    given: три карточки — с type, без type но с owner, без обоих
    when: отрисованы строки витрины
    then: >
      колонка «Тип» показывает соответственно type, owner и пустую ячейку; пустая ячейка сохраняет
      ширину колонки, соседние колонки не сдвигаются; карточка без обоих полей отображается целиком
    negative: true

  # ------------------------------------------- ревизия 1.10: вкладки и пустые состояния (S-V11, S-V12)
  - id: AC-217
    rule: [S-V11, S-Q9]
    type: unit
    given: каталог из пяти карточек двух владельцев
    when: открыта витрина
    then: >
      список плоский: заголовков групп владельцев нет, порядок строк совпадает с порядком каталога;
      в исходнике витрины нет группировки списка по owner

  - id: AC-218
    rule: [S-V11]
    type: integration
    given: >
      каталог, где две карточки в состоянии «Подключено», одна needs_auth, одна unavailable и одна
      not_connected
    when: прочитан набор доступных вкладок, выбрана вкладка «Подключённые», затем «Все»
    then: >
      доступных вкладок РОВНО ДВЕ — «Все» и «Подключённые» (ревизия 1.12); третьей вкладки
      «Неподключённые» нет ни в разметке, ни в перечислимом типе вкладок, и выбрать её нечем
      (AC-221); во вкладке «Подключённые» показаны ровно две строки — те самые карточки состояния 4
      таблицы S-V16, а needs_auth, unavailable и not_connected в неё не попадают ни по одному; во
      вкладке «Все» показаны все пять строк, включая эти три; умолчание при открытии — «Все»; выбор
      вкладки не сохраняется между запусками

  - id: AC-219
    rule: [S-V11]
    type: integration
    given: выбрана вкладка «Подключённые», в поиске введён запрос
    when: пользователь переключил вкладку на «Все», затем вернулся
    then: >
      строка поиска не очищена, вкладка не сброшена вводом в поиск; видны строки, удовлетворяющие
      обоим условиям одновременно

  - id: AC-220
    rule: [S-V12]
    type: integration
    given: каталог непустой, но ни одна карточка не подключена
    when: выбрана вкладка «Подключённые»
    then: >
      показано пустое состояние «Пока ничего не подключено» с действием «Показать все»; оно отличимо
      от «Каталог пуст» и «Каталог не разобран»; нажатие действия переводит вкладку в «Все» и не
      трогает строку поиска
    negative: true

  - id: AC-221
    rule: [S-V12, S-V11]
    type: integration
    given: >
      каталог, в котором подключены все карточки (прежде этот случай давал шестое пустое состояние
      «Подключено всё» во вкладке «Неподключённые»; ревизией 1.12 вкладка убрана решением
      заказчика, и критерий проверяет ОТСУТСТВИЕ снятого требования, а не его выполнение)
    when: открыта витрина, прочитаны разметка вкладок, набор пустых состояний и словари
    then: >
      вкладки «Неподключённые» нет ни в разметке, ни в наборе доступных фильтров; шестого пустого
      состояния «Подключено всё» не существует ни при каком составе каталога; ключей
      corp.connectors.tabNotConnected и corp.empty.tabNotConnected нет ни в одном из трёх словарей;
      при этом состояние 5 («Пока ничего не подключено» во вкладке «Подключённые») и его действие
      «Показать все» работают как прежде
    negative: true

  - id: AC-222
    rule: [S-V12]
    type: integration
    given: четыре прежних сценария — servers=[], все карточки отброшены, hub_error без карточек, нет ключа
    when: открыта витрина
    then: >
      показаны прежние четыре состояния с прежними действиями («Обновить»/«Обновить»/«Обновить»/
      «Войти»), все ПЯТЬ состояний (ревизия 1.12) попарно различимы текстом; при «Hub недоступен» и «Требуется вход»
      вкладки не показываются
    negative: true

  # ------------------------------------------- ревизия 1.10: колонка «Статус» (S-V18)
  - id: AC-223
    rule: [S-V18, S-Q9]
    type: unit
    given: строки в состояниях «Подключено», «Требуется вход», «Подключение не удалось», «Не подключён»
    when: отрисована колонка «Статус»
    then: >
      каждая ячейка содержит текст состояния И цветовую точку; цвет точки — семантический токен темы
      (success/warning/danger/второстепенный текст соответственно); текст присутствует всегда, точка
      его дублирует, а не заменяет; текст оформлен контрастными классами, text-text-weaker в ячейке нет

  - id: AC-224
    rule: [S-V18, S-T10]
