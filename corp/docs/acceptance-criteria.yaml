      --background-bg-layer-01, --border-border-base, --border-border-strong, --border-border-focus)
      объявлены в packages/app/src/components/corp/dialog-shell.css на контейнере корп-окна и
      указывают на соответствующие --v2-* переменные; ни один файл packages/ui/** не изменён
      относительно базового тега; новых строк в corp/patches.md не появилось

  - id: AC-233
    rule: [S-I5, S-Q9]
    type: unit
    given: исходники корп-компонентов packages/app/src/components/corp/** и packages/tui/src/corp/**
    when: выполнен тест запрета кириллицы
    then: >
      ни один строковый литерал в исходниках не содержит кириллицы; все тексты оболочки (вкладки,
      колонки, режимы разрешений, пустые состояния, подтверждения) берутся из словарей и присутствуют
      в обоих языках с непустыми и различающимися значениями
    negative: true

  - id: AC-234
    rule: [S-I6]
    type: unit
    given: >
      тестовая карточка каталога с русскими значениями title/description групп разрешений и русским
      значением type
    when: отрисованы экран разрешений и колонка «Тип», выполнен тест запрета кириллицы
    then: >
      русские значения отрисованы как есть, без перевода и подмены ключами словаря; тест запрета
      кириллицы (AC-233) при этом проходит — он проверяет литералы в исходниках, а не отрисованный
      текст; ключей на эти значения в словарях нет

  # ------------------------------------------- ревизия 1.10: тесты (S-Q12, S-Q13)
  - id: AC-235
    rule: [S-Q12, S-D12]
    type: unit
    given: >
      CSS корп-окон (витрина, экран входа, страница коннектора, экран разрешений) и настоящие файлы
      тем packages/ui/src/styles/theme.css и packages/ui/src/v2/styles/theme.css, загруженные в
      happy-dom
    when: для каждой переменной var(--…), встречающейся в этих стилях, прочитано вычисленное значение
    then: >
      каждая переменная разрешается в непустое значение И в светлой, И в тёмной теме; пустая строка —
      провал теста; список переменных собран из файлов стилей, а не перечислен в тесте руками
    negative: true

  - id: AC-236
    rule: [S-Q12]
    type: unit
    given: segmented-control-v2.css в состоянии до починки (семь переменных без префикса v2-)
    when: выполнен тест разрешимости токенов
    then: >
      тест падает и называет каждую неразрешимую переменную; после добавления алиасов в
      dialog-shell.css (AC-232) тест проходит в обеих темах — это его приёмочное свойство
    negative: true

  - id: AC-237
    rule: [S-Q13, S-V21]
    type: unit
    given: >
      конфиг, ПОЛУЧЕННЫЙ сохранением по S-V21 в двух вариантах: rest=allow с группой в режиме deny и
      rest=deny с группой в режиме allow; инструмент группы покрыт и wildcard, и явным правилом
    when: этот инструмент прогнан через Permission.evaluate
    then: >
      явное правило побеждает в обоих направлениях — deny при rest=allow и allow при rest=deny;
      проверка выполнена на результате Permission.evaluate, а не на составе ключей конфига (у
      правильной и у неправильной по порядку записи состав ключей одинаков); инструмент другого
      коннектора и ключи edit/bash/"*" сохраняют прежнее действие

  - id: AC-238
    rule: [S-Q13, S-V21]
    type: integration
    given: коннектор подключён, одна из его групп переведена в режим deny
    when: получен список инструментов, который видит модель
    then: >
      инструментов этой группы в списке нет; инструменты групп в режимах allow и ask в списке есть;
      проверка выполнена на составе списка инструментов, а не на факте отказа при вызове

  - id: AC-239
    rule: [S-V1, S-V23]
    type: integration
    given: коннектор с permission_groups, роут PUT /corp/connectors/<alias>/permissions
    when: отправлено тело с полем modes (режим на каждую группу)
    then: >
      запрос к Hub не выполнен вовсе; ответ содержит пересчитанный permission_state и
      reauth_required=false; тело с одновременно переданными preset и modes отвергнуто как ошибка
      запроса, при этом конфиг не изменён; прежнее тело {preset} для прочих видов модели работает
      как прежде
    negative: true

  # ------------------------------------------- ревизия 1.11: источник каталога без Hub (S-C10)

  - id: AC-240
    rule: [S-C10]
    type: unit
    given: >
      сборка, в которой build-константа OPENCODE_CORP_CATALOG_URL задана значением
      "https://dist.example/catalog/v1/catalog.json/" (с хвостовым слэшем), и вторая сборка, в
      которой константа не определена
    when: вычислен действующий адрес статического каталога
    then: >
      в первой сборке адрес нормализован так же, как адрес Hub: хвостовые слэши отброшены, пробелы
      обрезаны; переменная окружения OPENCODE_CORP_CATALOG_URL процесса перебивает build-константу;
      пустая строка и строка из пробелов означают «не задано»; значение, не являющееся абсолютным
      URL со схемой http/https, отброшено с предупреждением в лог, называющим переменную и значение,
      и загрузка не падает; флага командной строки для адреса каталога нет — --hub на него не влияет;
      во второй сборке адрес не определён
    negative: true

  - id: AC-241
    rule: [S-C10, S-C5]
    type: unit
    given: четыре сборки — только Hub; только каталог; оба адреса; ни одного
    when: проверена включённость корп-функций и доступность корп-роутов
    then: >
      корп-функции включены в первых трёх и выключены только в четвёртой (корп-роуты отвечают
      501 corp_disabled, пункт «Коннекторы» не рендерится, корп-экран входа не регистрируется);
      в сборке «только каталог» витрина работает, а корп-экран входа и opencode corp login
      недоступны с названной причиной, вместо запроса на незаданный адрес Hub; в сборке
      «только Hub» поведение совпадает с поведением до ревизии 1.11 во всём наблюдаемом объёме
    negative: true

  - id: AC-242
    rule: [S-C10, S-V1, S-Q4]
    type: integration
    given: заданы оба адреса — статического каталога и Hub; статический адрес отвечает корректным конвертом
    when: выполнен GET /corp/catalog
    then: >
      выполнен ровно один исходящий запрос — GET по статическому адресу, без заголовка
      Authorization; запроса к {hub}/api/catalog нет вовсе (проверяется по перехваченным запросам);
      ответ содержит source="static" и карточки статического каталога

  - id: AC-243
    rule: [S-C10, S-V14]
    type: unit
    given: >
      одно и то же тело {version, servers:[…]} подано дважды — как ответ Hub и как ответ
      статического адреса; у карточек отсутствует поле connection
    when: выполнен разбор каталога
    then: >
      результат разбора, список принятых карточек и список dropped в обоих случаях совпадают
      полностью (второго парсера каталога не существует); отсутствие connection не отбрасывает
      карточку и не попадает в dropped; состояние карточки вычисляется по локальным данным, а
      признак «подключение состоялось» — по локальной истории

  - id: AC-244
    rule: [S-C10, S-V3, S-V14, S-Q4]
    type: integration
    given: >
      заданы оба адреса; в кэше лежит ранее сохранённый каталог; статический адрес отвечает телом,
      не проходящим разбор конверта (не JSON-объект / нет version / version объект / servers не массив)
    when: выполнен GET /corp/catalog
    then: >
      выбор перешёл к следующему источнику — выполнен запрос к {hub}/api/catalog, и при его успехе
      ответ содержит source="hub"; битое тело не записано в кэш ни дословно, ни частично и не
      затёрло ранее сохранённый каталог; в лог записана диагностика с причиной отказа конверта;
      пользователю не показана ошибка hub_invalid_response
    negative: true

  - id: AC-245
    rule: [S-C10, S-V12]
    type: integration
    given: >
      задан только статический адрес (Hub не задан), адрес недоступен по сети; в одном прогоне кэш
      есть, в другом кэша нет
    when: открыта витрина
    then: >
      при наличии кэша карточки отданы из кэша с source="cache" и правилами stale по S-V3; при
      отсутствии кэша показано пустое состояние «Каталог недоступен» с действием «Обновить», и в
      нём нет слова «Hub»
    negative: true

  - id: AC-246
    rule: [S-C10, S-V3, S-V1]
    type: integration
    given: задан статический адрес; он отвечает корректным конвертом с полями permission_groups и type
    when: каталог получен, затем следующий запрос выполнен при недоступном источнике
    then: >
      успешный ответ записан в кэш; permission_groups и type сохранены в кэше дословно, как пришли;
      файл кэша ключуется адресом источника, из которого каталог получен, и не смешивается с кэшем
      другого адреса; повторная отдача из кэша даёт source="cache", а не "static"

  - id: AC-247
    rule: [S-C10, S-V9, S-Q4]
    type: integration
    given: >
      источник каталога статический, адрес Hub не задан; карточка с permission_groups подключена;
      вторая карточка — с моделью прав header_groups
    when: >
      отправлено PUT /corp/connectors/<alias>/permissions с телом {modes} для первой карточки и с
      телом {preset} для второй
    then: >
      для первой выполнены только локальные шаги — блок permission в конфиге перезаписан, ответ
      содержит пересчитанный permission_state и reauth_required=false, исходящих запросов ноль; для
      второй роут отвечает отказом с названной причиной, конфиг не изменён, а её экран прав
      показан заблокированным с текстом corp.connectors.permissionsNeedHub
    negative: true

  - id: AC-248
    rule: [S-C10, S-V8, S-V17]
    type: integration
    given: адрес Hub не задан, источник каталога статический; коннектор подключён
    when: выполнены «Отключить», а затем «Убрать из списка»
    then: >
      выполнены только локальные шаги (снятие авторизации, disconnect, правка/удаление ключа
      mcp.<alias>, обновление файла признака подключений); шаг обращения к Hub пропущен, поле
      hub_error в ответах отсутствует, предупреждение о недоступности Hub не показано; оба действия
      завершились успехом
    negative: true

  - id: AC-249
    rule: [S-C10, S-V16, S-Q4]
    type: unit
    given: >
      наборы действий вычислены общим модулем для всех четырёх состояний S-V16 и для строки 1
      таблицы S-V6 — дважды: при заданном адресе Hub и при незаданном
    when: сверены полученные наборы
    then: >
      при незаданном адресе действие open_hub отсутствует во всех наборах и не заменено
      заблокированным элементом; остальные действия каждого состояния совпадают с прежними
      дословно; при заданном адресе все наборы совпадают с наборами ревизии 1.10 дословно; TUI и
      Desktop берут наборы из одного модуля и вычисляют их не сами
    negative: true

  - id: AC-250
    rule: [S-C10, S-V12, S-I1, S-Q9]
    type: unit
    given: витрина отрисована на данных со статическим источником каталога — с карточками и без карточек
    when: проверено отрисованное дерево и словари
    then: >
      в отрисованном тексте нет ни одного вхождения подстроки «Hub» — ни в действиях, ни в баннере,
      ни в пустом состоянии; ключи corp.connectors.catalogUnavailable, corp.connectors.facadeNeedsHub
      и corp.connectors.permissionsNeedHub присутствуют в en.ts, ru.ts и в словаре TUI, значения
      непусты и различаются между языками; на тех же данных с hub-источником текст пустого состояния
      остаётся прежним «Hub недоступен»
    negative: true

  - id: AC-251
    rule: [S-C10, S-V7, S-V28]
    type: integration
    given: >
      источник каталога статический, адрес Hub не задан; карточка mode="native" с mcp_url; снимок
      глобального конфига снят до вызова. Микроревизия 1.13.1: прежняя формулировка требовала
      записать mcp.<alias> и запустить штатный MCP OAuth — после расширения запрета S-V28 на
      mode:"native" это требование отменено заказчиком и заменено, а не ослаблено
    when: выполнено действие «Подключить»
    then: >
      роут отвечает 409 {error:"auth_method_unavailable", unavailable_code:"oauth_disabled"};
      глобальный конфиг побайтово тот же, что в снимке — ключ mcp.<alias> НЕ создан; ни DCR, ни
      PKCE, ни callback не запускались, браузер не открыт; ни одного обращения по адресу Hub и ни
      одного по OAuth-адресам MCP-сервера за всё действие нет; карточка остаётся в витрине с
      действием «Подключить», отрисованным неактивным, и текстом причины рядом с ним. Отсутствие
      Hub на исход не влияет: причина отказа та же и при заданном адресе Hub
    negative: true

  - id: AC-252
    rule: [S-C10, S-V7, S-V9]
    type: integration
    given: источник каталога статический, адрес Hub не задан; карточка mode="facade"
    when: открыта витрина и страница этого коннектора
    then: >
      карточка присутствует в списке и имеет статус по S-V6; действие «Подключить» недоступно, запись
      mcp.<alias> не создана; причина недоступности показана на месте кнопки, а не в другой части
      экрана, и названа текстом corp.connectors.facadeNeedsHub
    negative: true

  - id: AC-253
    rule: [S-C10, S-C5]
    type: integration
    given: источник каталога статический; записи magnit_prod в auth-store нет
    when: выполнен GET /corp/catalog
    then: >
      каталог получен и карточки отданы; состояние «Требуется вход» (S-V4, S-V12 п. 4) не показано
      и hub_error="unauthorized" не возвращён — это правило относится к источнику Hub; при
      hub-источнике и отсутствии ключа поведение прежнее дословно
    negative: true

  # ------------------------------------------- ревизия 1.11: цепочка автоната релиза (S-B16)

  - id: AC-254
    rule: [S-B16, S-Q11]
    type: ci
    given: >
      корп-ветка, последний выпущенный тег v1.17.9-magnit.3, в ветку влит коммит
      «corp: слить upstream v1.18.0»
    when: отработала цепочка автотега
    then: >
      создан тег v1.18.0-magnit.1 — при смене версии upstream счёт корп-сборок начинается заново;
      версия для имени тега получена из того же источника, что версия артефактов, поэтому имя тега
      и версия внутри артефактов совпадают

  - id: AC-255
    rule: [S-B16, S-Q11]
    type: ci
    given: >
      последний выпущенный тег v1.17.9-magnit.3, влит коммит «corp: слить upstream v1.17.9»
    when: отработала цепочка автотега
    then: создан тег v1.17.9-magnit.4 — номер увеличен относительно максимума тегов той же версии upstream

  - id: AC-256
    rule: [S-B16, S-Q11]
    type: ci
    given: коммит уже помечен тегом v1.17.9-magnit.4
    when: цепочка автотега запущена на нём повторно
    then: >
      задание завершилось успехом, нового тега не создано и существующий не переставлен;
      два одновременных запуска не могут выпустить два тега — постановка последовательна
    negative: true

  - id: AC-257
    rule: [S-B16]
    type: ci
    given: >
      в корп-ветку влит обычный корп-коммит («corp: правка витрины»), не являющийся мержем upstream
    when: отработали триггеры ветки
    then: тега не создано; сборка Desktop, черновик релиза и публикация не запускались
    negative: true

  - id: AC-258
    rule: [S-B16, S-Q10]
    type: ci
    given: сборка Desktop канала magnit с заданным адресом обновлений завершилась
    when: собран набор артефактов задания и набор файлов раздачи
    then: >
      фид magnit-mac.yml входит и в артефакты задания, и в набор файлов публикации наряду с
      dmg/zip/blockmap; builder-debug.yml не входит ни туда, ни туда; отсутствие фида при заданном
      адресе обновлений валит задание, а не проходит молча

  - id: AC-259
    rule: [S-B16, S-Q10]
    type: unit
    given: >
      каталог сборки в четырёх состояниях: корректный набор «фид + названные им файлы»; фида нет;
      файл, названный фидом, отсутствует рядом; sha512 записи расходится с фактическим файлом
    when: выполнен verify-desktop-bundle с --update-url
    then: >
      первый случай — успех; остальные три — ненулевой код выхода и названное расхождение, причём
      перечислены все найденные расхождения, а не первое; без --update-url правило не применяется и
      прежняя проверка (app-update.yml в бандле быть не должно) работает дословно
    negative: true

  - id: AC-260
    rule: [S-B16]
    type: integration
    given: выкладка релиза на внутренний сервер с подменённым приёмником запросов
    when: публикация выполнена
    then: >
      по последовательности обращений видно, что сначала выложены все артефакты (архивы, установщики,
      blockmap), и только затем фиды — magnit-mac.yml и <CLI>/latest; клиент, опросивший фид в любой
      момент выкладки, получает либо старую версию целиком, либо новую целиком, и ни один названный
      фидом файл не отвечает 404

  - id: AC-261
    rule: [S-B16]
    type: ci
    given: тег v*-magnit.*; в одном прогоне секрет адреса внутреннего сервера не задан, в другом задан
    when: отработало задание публикации
    then: >
      без секрета задание пропущено с сообщением «внутренний сервер не настроен — публикация
      пропущена», прогон зелёный, артефакты остаются в прогоне и в черновике релиза; сообщение
      отличимо в логе от «публиковать нечего»; с секретом выкладка выполнена
    negative: true

  - id: AC-262
    rule: [S-B16, S-B3, S-B8, S-Q10]
    type: ci
    given: прогон по тегу v*-magnit.*
    when: собран Desktop
    then: >
      обе архитектуры macOS (arm64 и x64) собраны ОДНИМ вызовом сборки в одном задании; в каталоге
      сборки ровно один фид magnit-mac.yml, и его список files перечисляет архивы обеих архитектур;
      каждый .app проверен на наличие Electron Framework и исполняемого файла

  - id: AC-263
    rule: [S-B16, S-B3, S-B8, S-Q10]
    type: ci
    given: прогон по тегу и конфигурация упаковки Desktop
    when: проверены матрица целей и содержимое electron-builder.config.ts
    then: >
      Windows-цели Desktop в матрице тега нет; блок win/nsis конфигурации упаковки не изменён
      относительно upstream и новых строк в corp/patches.md из-за этого не появилось; CLI-цель
      win32-x64 в матрице сборки CLI сохранена и её smoke выполняется как прежде
    negative: true

  - id: AC-264
    rule: [S-B16, S-B14, S-B8, S-Q11]
    type: integration
    given: выкладка релиза на внутренний сервер выполнена
    when: проверена раскладка сервера и черновик релиза
    then: >
      по адресу <CORP_DESKTOP_UPDATE_URL>/magnit-mac.yml лежит фид, а названные им архивы лежат
      плоско рядом с ним; по адресу <CORP_CLI_UPDATE_URL>/latest лежит JSON {version} строкой,
      который читает opencode upgrade, и он выложен после архивов CLI; черновик GitHub Release
      создан независимо от публикации на внутренний сервер

  # ------------------------------------------- ревизия 1.11: неподписанная раздача macOS (S-B17)

  - id: AC-265
    rule: [S-B17, S-Q11]
    type: unit
    given: сборка пакета установщика дважды — без флага --signed и с ним
    when: прочитан common/manifest.json собранного пакета
    then: >
      манифест содержит поле signed булевого типа: false в первом случае, true во втором; поле
      присутствует всегда (отсутствие ключа не используется как способ сказать «не подписано»);
      манифест валиден по своей схеме в обоих случаях

  - id: AC-266
    rule: [S-B17, S-Q11]
    type: integration
    given: >
      пакет с полем манифеста "signed" = false, установка на macOS
    when: выполнена установка Desktop
    then: >
      после копирования .app в каталог назначения выполнено снятие карантина
      (xattr -dr com.apple.quarantine <путь к .app>), и в отчёт установки попала строка об этом;
      приложение запускается без сообщения о повреждении

  - id: AC-267
    rule: [S-B17, S-Q11]
    type: integration
    given: >
      пакет с полем манифеста "signed" = false; снятие карантина завершается неудачей
      (нет утилиты либо нет прав)
    when: выполнена установка Desktop
    then: >
      установка завершилась успехом, код возврата не изменился, приложение установлено; в отчёт
      попало предупреждение с готовой командой для ручного снятия карантина; отказа установки нет
    negative: true

  - id: AC-268
    rule: [S-B17, S-Q11]
    type: integration
    given: >
      пакет с полем манифеста "signed" = true, установка на macOS
    when: выполнена установка Desktop
    then: >
      снятие карантина не вызывалось ни разу; в отчёте установки нет ни одной строки о карантине;
      на платформах, отличных от macOS, шаг не выполняется независимо от значения signed
    negative: true

  - id: AC-269
    rule: [S-B17]
    type: unit
    given: запуски release.sh — только с --catalog-url; только с --hub-url; без обоих
    when: выполнена сборка пакета
    then: >
      первые два собирают пакет, и в манифест записан заданный адрес (--hub-url перестал быть
      обязательным); третий отказывает с ненулевым кодом и понятным сообщением до начала сборки
      пакета — пакет без единой точки входа не создаётся
    negative: true

  - id: AC-270
    rule: [S-B17]
    type: integration
    given: release.sh запущен с обоими адресами — --hub-url и --catalog-url
    when: собран пакет и выполнена установка
    then: >
      в манифесте присутствуют оба адреса; отчёт установки и режим проверки пакета печатают заданные
      адреса; установщик ни один из них никуда не записывает помимо отчёта

  - id: AC-271
    rule: [S-B17, S-Q11]
    type: unit
    given: >
      четыре каталога артефактов: dmg с arm64 в имени; dmg с x64 в имени; оба типизированных имени
      при запросе третьей архитектуры; единственный dmg без архитектуры в имени
    when: выполнен поиск Desktop-артефакта для целей darwin-arm64 и darwin-x64
    then: >
      для каждой из двух архитектур найден dmg своей архитектуры (пакет darwin-x64 больше не
      собирается без Desktop); при отсутствии нужной архитектуры среди типизированных имён Desktop в
      пакет не кладётся и это названо в отчёте сборки как дефект, а не как штатная строка; при
      единственном нетипизированном dmg он берётся; бандл чужой архитектуры в пакет не попадает
      ни в одном случае
    negative: true

  - id: AC-272
    rule: [S-B17]
    type: manual
    given: собранный пакет установщика для macOS без подписи
    when: прочитан docs/install-user.md пакета
    then: >
      документ содержит абзац о неподписанной сборке: почему macOS может сообщить о «повреждении»,
      что делает установщик (снимает карантин) и какой командой снять карантин вручную, если шаг
      не удался

  # ------------------------------------------- микроревизия 1.11.1: находки реализации

  - id: AC-273
    rule: [S-I1, S-C5]
    type: unit
    given: сборка без адреса Hub со заданным адресом статического каталога
    when: пользователь открывает то место, откуда открывался бы корп-экран входа
    then: >
      показан текст ключа corp.login.needsHub, называющий причину («Вход по корпоративному SSO в
      этой сборке не настроен»), а не пустой экран и не запрос на незаданный адрес; ключ присутствует
      в en.ts, ru.ts и в словаре TUI, значения непусты, различаются между языками и совпадают между
      app и TUI по нормализации; слова «Hub» в тексте нет

  - id: AC-274
    rule: [S-V9, S-I1]
    type: integration
    given: >
      карточка, у которой не разобрана ни permission_groups, ни permission_model (последняя строка
      таблицы S-V9), — в двух сборках: без адреса Hub и с ним
    when: открыт экран прав этой карточки
    then: >
      в обеих сборках экран заблокирован и причина названа; в сборке БЕЗ Hub показан текст
      corp.connectors.permissionsUnavailableNoHub — та же причина («модель прав не поддерживается
      этой версией приложения») без совета управлять правами в Hub, и слова «Hub» в нём нет; в
      сборке С Hub показан прежний текст corp.connectors.permissionsUnavailable дословно (проверки
      ревизии 1.7, включая AC-166, остаются в силе); сообщение о деградации разбора (S-V14) видимо в
      обеих сборках; выбор текста сделан по тому же признаку «адрес Hub задан», по которому
      определяется наличие действия open_hub, и оболочка не читает build-константу второй раз
    negative: true

  - id: AC-275
    rule: [S-I1, S-Q9]
    type: unit
    given: >
      сборка без адреса Hub; матрица ветвей интерфейса: пять пустых состояний (S-V12), четыре
      состояния карточки (S-V16) и строка 1 таблицы S-V6, оба способа подключения (native, facade),
      все пять видов модели прав (S-V9) включая неразобранную, экран входа (S-C5), баннер над
      непустым списком, подтверждение «Убрать из списка», четыре класса ошибок подключения (S-V19)
    when: для каждой ветви прочитан ОТРИСОВАННЫЙ текст в обоих языках, в app и в TUI
    then: >
      ни в одной ветви отрисованный текст не содержит подстроки «Hub» без учёта регистра — включая
      ветви, текст которых пришёл из ключей прежних ревизий; проверка выполнена по отрисованному
      тексту, а не грепом по словарям (слово «Hub» в словаре законно: оно показывается в сборке с
      Hub); полнота матрицы утверждена отдельно — перечни состояний, видов модели прав и пустых
      состояний берутся из тех же перечислимых типов, которыми они объявлены в коде, поэтому новое
      значение без новой ветви матрицы валит тест; те же ветви в сборке С Hub показывают прежние
      тексты, и ни один из них не изменён
    negative: true

  - id: AC-276
    rule: [S-D12, S-Q12]
    type: unit
    given: >
      корп-окно, смонтированное с настоящими файлами тем и CSS используемых компонентов, содержит
      кнопку variant="secondary" в состоянии disabled
    when: прочитано вычисленное значение --surface-disabled и фон кнопки в светлой и тёмной темах
    then: >
      алиас --surface-disabled: var(--surface-weak) объявлен в
      packages/app/src/components/corp/dialog-shell.css на контейнере корп-окна; переменная
      разрешается в непустое значение в обеих темах, фон отключённой кнопки непуст; ни один файл
      packages/ui/** не изменён относительно базового тега и новых строк в corp/patches.md не
      появилось; все прежние проверки AC-232 по семи алиасам SegmentedControlV2 продолжают проходить

  - id: AC-277
    rule: [S-D12, S-Q12]
    type: unit
    given: элемент с кнопкой variant="secondary" в состоянии disabled, смонтированный ВНЕ контейнера корп-окна
    when: прочитано вычисленное значение --surface-disabled в обеих темах
    then: >
      переменная не разрешается (значение пусто) — алиас ограничен поддеревом корп-окна и на
      остальное приложение не влияет; это фиксирует, что пробел upstream (F57) замаскирован в
      корп-окнах, а не починен (D-47), и одновременно ловит противоположную ошибку — алиас,
      объявленный на :root и молча изменивший вид всего приложения; область проверки AC-235 при
      этом не сужается: все переменные всех стилей корп-окон по-прежнему проверяются в обеих темах
    negative: true

  - id: AC-278
    rule: [S-V17, S-V19, S-I1]
    type: unit
    given: >
      четыре текста, переформулированные микроревизией 1.11.1 (corp.connectors.forgetConfirm,
      corp.error.connect.token_rejected, corp.error.connect.method_unavailable,
      corp.error.connect.hub_unreachable), и две сборки — с адресом Hub и без него
    when: тексты отрисованы в обеих сборках, в обоих языках, в app и в TUI
    then: >
      в обеих сборках показан ОДИН и тот же текст — условных ключей на эти четыре случая не
      заведено; ни в одном из них нет слова «Hub», и при этом объяснение остаётся верным в сборке с
      Hub (отказавший или недоступный Hub — тоже «сервер»); имена ключей словаря и значения
      error_class (в частности "hub_unreachable") не изменены, поэтому AC-180…AC-183 и AC-187
      продолжают проходить; словарь TUI несёт те же тексты по нормализации; ключи
      corp.connectors.forgetHubFailed, corp.empty.hubUnavailable и
      corp.connectors.permissionsUnavailable слово «Hub» сохраняют и в сборке без Hub недостижимы
    negative: true

