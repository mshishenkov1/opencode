    when: показан подключённый коннектор
    then: >
      там, где колонки нет, признак подключения по-прежнему выражен бейджем Tag (/mcps, страница
      коннектора) или текстовым маркером начала строки (TUI, монохромный терминал); роль маркера TUI
      ревизией 1.10 не изменена

  # ------------------------------------------- ревизия 1.10: композиция и стек (S-D6, S-D11, S-D10)
  - id: AC-225
    rule: [S-D6]
    type: unit
    given: витрина открыта в обеих ветках флага оформления
    when: прочитана разметка окна
    then: >
      окно — CorpDialog; фильтр — TabsV2 с variant="pill" и ДВУМЯ вкладками (ревизия 1.12); шапка
      «Имя | Тип | Статус» присутствует; список — существующий List, строки размечены CSS-grid;
      ширины колонок шапки и строк заданы одним объявлением grid-template-columns в dialog-shell.css

  - id: AC-226
    rule: [S-D6, S-Q9]
    type: unit
    given: витрина с числом строк, заведомо превышающим высоту окна
    when: список прокручен вниз
    then: >
      шапка «Имя | Тип | Статус» остаётся на месте и не входит в область прокрутки; вкладки, баннер
      «Hub недоступен» и предупреждение об отброшенных карточках тоже не прокручиваются вместе со
      списком

  - id: AC-227
    rule: [S-D11]
    type: unit
    given: открыта витрина, выделена строка коннектора
    when: выполнено основное действие строки (щелчок либо Enter)
    then: >
      страница коннектора открыта вызовом useDialog().push, а не show; витрина осталась в стеке
      диалогов и не была уничтожена; Esc и кнопка «Назад» закрывают верхний диалог и возвращают
      витрину

  - id: AC-228
    rule: [S-D11, S-Q9]
    type: integration
    given: >
      витрина: выбрана вкладка «Подключённые» (не умолчание — ревизия 1.12 оставила две вкладки,
      «Все» и «Подключённые»), в поиск введён запрос, список прокручен к нижней строке
    when: открыта страница коннектора и выполнен возврат
    then: >
      вкладка «Подключённые» выбрана, строка поиска содержит прежний запрос, позиция прокрутки
      прежняя; ничего из этого не сбрасывается в умолчание «Все»

  - id: AC-229
    rule: [S-D11, S-V19, S-V17]
    type: integration
    given: коннектор с description, type, owner, docs_url и неудачной попыткой подключения
    when: открыта страница коннектора
    then: >
      показаны заголовок с title, описание, свойства «Тип»/«Владелец»/ссылка на документацию, блок
      статуса с объяснением ошибки и предлагаемым действием по классу error_class (S-V19 не изменён),
      блок «Разрешения» и блок «Убрать из списка» (S-V17 не изменён); отсутствующее свойство строки
      не рисует, пустой строки не оставляет

  - id: AC-230
    rule: [S-D10]
    type: unit
    given: >
      страница коннектора с коротким описанием и одной группой разрешений и она же с длинным описанием
      и пятнадцатью группами, в обеих ветках флага оформления
    when: измерена высота видимой панели окна
    then: >
      высота одинакова в обоих случаях и совпадает с высотой витрины и окна настроек той же ветки;
      прокручивается содержимое страницы внутри окна, окно целиком не прокручивается; открытие
      страницы поверх витрины размер окна не меняет

  # ------------------------------------------- ревизия 1.10: контраст, CSS и локализация (S-D12, S-I5, S-I6)
  - id: AC-231
    rule: [S-D12, S-Q9]
    type: unit
    given: исходники packages/app/src/components/corp/**
    when: выполнен тест контраста
    then: >
      подстроки "text-11-regular" в них нет ни разу (класс не объявлен в utilities.css и ничего не
      делает); класса text-text-weaker для содержательного текста нет ни разу; второстепенный текст
