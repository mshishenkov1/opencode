      в списке приложений видны две записи — «OpenCode» и «OpenCode Magnit»

  - id: AC-151
    rule: [S-B12]
    type: manual
    given: обе сборки установлены, в корпоративной выполнен вход по корпоративному SSO
    when: открыт ванильный OpenCode
    then: >
      ванильная сборка не показывает корп-режим, не знает о ключе magnit_prod, её настройки и сессии
      не изменились; корпоративная сборка после этого продолжает работать с сохранённым ключом

  - id: AC-152
    rule: [S-Q10]
    type: unit
    given: тест конфигурации упаковки Desktop
    when: тест выполнен
    then: >
      покрыты каналы magnit, dev, beta, prod (upstream-значения appId, productName и publish, включая
      owner: "anomalyco" у prod), неизвестное значение (исключение) и незаданная переменная (dev),
      а также обе ветки фида обновлений — с CORP_DESKTOP_UPDATE_URL (provider generic и ровно этот
      адрес) и без неё (блока publish нет)

  - id: AC-153
    rule: [S-Q10, S-B8]
    type: ci
    given: шаг CI, собравший Desktop канала magnit
    when: выполнена проверка артефакта
    then: >
      проверены CFBundleIdentifier, CFBundleName и наличие/содержимое app-update.yml; шаг падает при
      чужом appId, чужом имени приложения или фиде, отличном от адреса из CORP_DESKTOP_UPDATE_URL

  # ------------------------------------------- ревизия 1.7: модель прав tool_filter и устойчивость разбора (BUG-I4-008)

  - id: AC-154
    rule: [S-V14, S-V2]
    type: unit
    given: >
      мок Hub GET /api/catalog отвечает живой карточкой tag: alias=tag, title="ТЭГ (Mattermost)",
      status=beta, mode=facade, mcp_url="https://hub.test/mcp/tag", auth_kind=user_token,
      permission_model={kind:"tool_filter", presets:{readonly:{tools:["whoami","get_*","list_*"]},
      readwrite:{tools:["*"]}}}
    when: вызван клиент Hub и открыта витрина
    then: >
      ошибки hub_invalid_response нет; карточка ТЭГ показана в витрине со своими действиями;
      permission_model доступен карточке без потерь — kind=tool_filter, presets.readonly.tools
      содержит все три элемента в исходном порядке, presets.readwrite.tools = ["*"]

  - id: AC-155
    rule: [S-V9]
    type: unit
    given: >
      в каталоге две карточки: tag с permission_model.kind=tool_filter
      (presets.readonly.tools=["whoami","get_*"], presets.readwrite.tools=["*"]) и карточка с
      permission_model.kind=consent (presets={default:{}})
    when: для каждой из них открыт экран прав
    then: >
      для tool_filter показаны пресеты readonly и readwrite (имена ключей presets в порядке ответа
      Hub), для выбранного пресета — список его tools как есть ("whoami", "get_*"); раздела групп и
      списка always нет, отдельные инструменты не отмечаются; для consent показаны только имена
      пресетов без состава прав; ни в одном случае клиент не формирует заголовок групп

  - id: AC-156
    rule: [S-V9, S-V14, D-27]
    type: unit
    given: карточка каталога с permission_model={kind:"quota_tiers", tiers:[…]} — вид клиенту неизвестен
    when: открыта витрина
    then: >
      карточка показана, счётчик коннекторов её учитывает; действия «Подключить», «Отключить» и
      «Открыть в Hub» доступны; действие «Права» видно, но заблокировано, рядом показана причина
      (модель прав не поддерживается этой версией приложения, правами можно управлять в Hub);
      запрос PUT /api/me/connections/<alias>/permissions не отправляется
    negative: true

  - id: AC-157
    rule: [S-V9, S-V14]
    type: unit
    given: карточка каталога, у которой permission_model отсутствует или не разобран
    when: открыта витрина
    then: >
      поведение совпадает с AC-156: карточка показана, «Права» заблокировано с той же причиной,
      подключение выполняется с пресетом readonly по умолчанию
    negative: true

  - id: AC-158
    rule: [S-V14, S-V3]
    type: unit
    given: >
      GET /api/catalog вернул конверт с тремя карточками: gitlab (валидна), карточка без alias,
      tag с permission_model.kind=tool_filter
    when: вызван клиент Hub и открыта витрина
    then: >
      ошибки hub_invalid_response нет; показаны две карточки — gitlab и tag; карточка без alias не
      показана; кэш перезаписан ровно этими двумя принятыми карточками

  - id: AC-159
    rule: [S-V14]
    type: unit
    given: >
      GET /api/catalog вернул четыре карточки: без alias, с alias но без title, с mode="proxy"
      (значения нет в перечислении), и одну полностью валидную
    when: вызван клиент Hub
    then: >
      первые три карточки отброшены и пользователю не показываются, четвёртая принята и показана;
      ошибки hub_invalid_response нет
    negative: true

  - id: AC-160
    rule: [S-V14, S-V2]
    type: unit
    given: >
      GET /api/catalog вернул 200 с нарушенным конвертом — по одному случаю на каждый: нет поля
      version; servers не массив; version недопустимого типа (null, true, объект, массив)
    when: вызван клиент Hub
    then: >
      в каждом случае возвращена ошибка hub_invalid_response, кэш не перезаписан, витрина показывает
      состояние «Hub недоступен» по S-V3
    negative: true

  - id: AC-161
    rule: [S-V12, S-V14]
    type: integration
    given: GET /api/catalog вернул корректный конверт с двумя карточками, обе отброшены по ядру
    when: открыта витрина
    then: >
      показано состояние «Каталог не разобран» с числом отброшенных карточек и действием «Обновить»;
      текст отличается от «Каталог пуст» (Hub ответил servers:[]) и от «Hub недоступен»
    negative: true

  - id: AC-162
    rule: [S-V14]
    type: unit
    given: >
      карточка tag содержит поле auth_methods (способы подключения ревизии 3 Hub) и произвольное
      неизвестное поле верхнего уровня, а её connection содержит неизвестное вложенное поле
    when: вызван клиент Hub
    then: карточка принята и показана полностью; неизвестные поля не влияют ни на приём, ни на действия

  - id: AC-163
    rule: [S-V14]
    type: unit
    given: карточка со status="sunset" (значения нет в перечислении beta|ga|deprecated)
    when: открыта витрина
    then: >
      карточка показана без бейджа состояния, статус и действия вычислены по S-V6 так, как если бы
      поля status не было; карточка не отброшена
    negative: true

  - id: AC-164
    rule: [S-V7, D-28]
    type: unit
    given: карточка tag, mode=facade, permission_model.kind=tool_filter
    when: выполнено «Подключить» с пресетом по умолчанию
    then: >
      Config.updateGlobal получил патч с oauth.scope="tag:readonly" — scope определяется режимом
      facade, а не видом модели прав; далее вызван POST /mcp/tag/auth/authenticate

  - id: AC-165
    rule: [S-V14, S-V1]
    type: unit
    given: в ответе Hub одна карточка отброшена по ядру, две приняты
    when: выполнен GET /corp/catalog
    then: >
      ответ содержит две карточки и dropped с одним элементом, в котором указаны alias (если он
      читался) и причина — путь к полю; в лог записано предупреждение с alias и путём к полю;
      ни тело ответа Hub целиком, ни ключ провайдера, ни poll_secret в лог не попадают

  - id: AC-166
    rule: [S-I1, S-I3, S-I5]
    type: unit
    given: словари packages/app/src/i18n/en.ts и ru.ts
    when: выполнен тест словарей
    then: >
      ключи corp.connectors.permissionsUnavailable, corp.connectors.toolsPreview,
      corp.connectors.partial и corp.empty.unparsed есть в обоих словарях, значения не совпадают
      между ru.ts и en.ts, захардкоженных строк для этих текстов в коде нет

  - id: AC-167
    rule: [S-Q2, S-Q4]
    type: unit
    given: тесты клиента Hub и витрины
    when: тесты выполнены
    then: >
      покрыты: живое тело карточки tag с tool_filter и auth_methods; карточка с неизвестным kind;
      карточка без alias рядом с валидными; карточка без title и с mode вне перечисления;
      нарушенный конверт; элемент GET /api/me/connections без alias; экран прав по всем четырём
      строкам таблицы S-V9; каталог, у которого отброшены все карточки

  # ------------------------------------------- ревизия 1.8: тип version в конверте каталога (диспут по S-V14 п.1)

  - id: AC-168
    rule: [S-V14, S-V2, D-29]
    type: unit
    given: >
