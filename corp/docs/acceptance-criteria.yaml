    given: >
      карточка каталога с блоком upstream и с auth_methods из двух элементов: corp_oauth
      (type: oauth2) и personal_token (type: user_token, field.label и verify.url заданы)
    when: запрошен GET /corp/catalog
    then: >
      в карточке ответа поле auth_methods содержит ОБА элемента со своими id, title и type; у
      карточки connect_mode == "direct"; блоки verify, exchange, revoke и credential_headers в теле
      ответа роута отсутствуют (их исполняет серверная часть, оболочке они не нужны); поле
      has_credentials == false

  - id: AC-304
    rule: [S-V24, S-V14, S-Q4]
    type: unit
    given: >
      карточка с auth_methods из трёх элементов, у среднего отсутствует поле type (ядро способа не
      разобрано)
    when: разобран каталог
    then: >
      средний элемент отброшен ПООДИНОЧКЕ, два других присутствуют, сама карточка НЕ отброшена и
      показывается; перечень ядра карточки (S-V14 п. 2) не расширен: карточка без auth_methods и без
      upstream принимается ровно как прежде
    negative: true

  - id: AC-305
    rule: [S-V24, S-V14]
    type: unit
    given: >
      два случая: способ user_token без field.label и способ user_token с verify.url, не являющимся
      абсолютным URL со схемой http/https
    when: разобран каталог
    then: >
      в обоих случаях способ отброшен, карточка осталась; если других способов user_token нет,
      connect_mode карточки считается дальше по таблице S-V7 (native или facade), а не становится
      "direct"; отбрасывание способа причиной отбрасывания карточки не является
    negative: true

  - id: AC-306
    rule: [S-V24, S-V7]
    type: unit
    given: >
      карточка mode:"facade" с разобранным способом user_token, но БЕЗ блока upstream (и вторая — с
      upstream, у которого credential_headers пустой объект)
    when: запрошен GET /corp/catalog при заданном и при незаданном адресе Hub
    then: >
      в обоих случаях connect_mode != "direct"; карточка остаётся в списке и не выглядит сломанной;
      при заданном адресе Hub connect_mode == "facade", при незаданном — "none" и на месте кнопки
      показана прежняя причина corp.connectors.facadeNeedsHub (правило S-C10 п. 8 не изменено)
    negative: true

  - id: AC-307
    rule: [S-V24, S-V3]
    type: unit
    given: >
      каталог с auth_methods (включая элемент, ядро которого клиент не разобрал) и с блоком upstream
    when: каталог получен, записан в кэш, процесс перезапущен, каталог прочитан из кэша
    then: >
      в файле кэша auth_methods и upstream лежат ДОСЛОВНО как пришли — со всеми вложенными блоками
      (field, verify, exchange, revoke, credential_headers, static_headers) и со ВСЕМИ элементами,
      включая неразобранный и объявленные недоступными; введённого пользователем токена в файле кэша
      нет ни в каком виде

  - id: AC-308
    rule: [S-V24, S-V28]
    type: unit
    given: способ user_token, у которого available задано строкой "yes" (не булево)
    when: вычислена доступность способа
    then: >
      способ НЕДОСТУПЕН: available == false, unavailable_code == "catalog_unavailable" — неразобранный
      признак деградирует в сторону запрета, а не разрешения; попытка подключиться этим способом даёт
      409 (AC-311)
    negative: true

  - id: AC-309
    rule: [S-V24, S-V28]
    type: unit
    given: >
      способ user_token, у которого одно из значений verify.headers равно "env:TAG_TOKEN"; и вторая
      карточка, у которой такое значение лежит в upstream.credential_headers
    when: вычислена доступность способа и выполнена попытка подключения
    then: >
      в обоих случаях способ недоступен с unavailable_code == "env_header"; значение env:… НЕ
      подставляется литералом и не разворачивается; за весь сценарий нет НИ ОДНОГО исходящего
      запроса; проверка выполнена на клиенте и от добросовестности генератора каталога не зависит
    negative: true

  - id: AC-310
    rule: [S-V28]
    type: unit
    given: способ corp_oauth с type:"oauth2" и available:true (каталог его не закрывал)
    when: запрошен GET /corp/catalog
    then: >
      способ ПРИСУТСТВУЕТ в массиве auth_methods карточки со своими id, title и type — он разобран,
      а не выброшен — и при этом available == false с unavailable_code == "oauth_disabled".
      «Не разобран» и «недоступен» — разные состояния: реализация, выбрасывающая oauth2-способы при
      разборе, критерий НЕ проходит, хотя внешне даёт тот же экран (S-V28 п. 6)

  - id: AC-311
    rule: [S-V28, S-V25]
    type: integration
    given: >
      карточка со способом corp_oauth (oauth2) и способом personal_token (user_token, доступен);
      снимок глобального конфига и файла хранилища учётных данных снят до вызова
    when: >
      выполнен POST /corp/connectors/:alias/connect-token с method="corp_oauth" и непустым token —
      запрос послан МИМО интерфейса, как это сделал бы curl или скрипт
    then: >
      ответ 409 {error:"auth_method_unavailable", unavailable_code:"oauth_disabled", message};
      за сценарий нет ни одного исходящего запроса (ни по verify.url, ни по authorize_url, ни по
      token_url, ни по upstream.url); глобальный конфиг и файл хранилища побайтово те же, что в
      снимке; тот же 409 повторяется при method="corp_oauth" и пустом token — проверка доступности
      идёт РАНЬШЕ проверки длины токена (S-V25 п. 1)
    negative: true

  - id: AC-312
    rule: [S-V28, S-D13, S-Q9]
    type: unit
    given: >
      три набора данных страницы коннектора: (1) доступен ровно один способ и недоступных нет;
      (2) два способа — oauth2 недоступен, user_token доступен; (3) доступных нет ни одного
    when: отрисована страница коннектора
    then: >
      случай (1) — элемента выбора способа в дереве нет вовсе, форма отрисована; случай (2) — в
      дереве ПРИСУТСТВУЕТ элемент выбора с id недоступного способа и атрибутом disabled, рядом с ним
      отрисован текст причины, поля ввода токена для недоступного способа в дереве НЕТ, а для
      доступного есть; случай (3) — формы нет, ни одного поля ввода нет, список способов с причинами
      отрисован. Спрятанный (не отрисованный вовсе) недоступный способ критерий НЕ проходит
    negative: true

  - id: AC-313
    rule: [S-V28, S-T12]
    type: unit
    given: одни и те же данные карточки, поданные Desktop и TUI
    when: обе оболочки отрисовали список способов подключения
    then: >
      набор доступных и недоступных способов и коды причин совпадают, потому что обе оболочки берут
      их из ответа роута и сами не вычисляют (S-V28 п. 3); за сеанс сборки без Hub нет ни одного
      исходящего запроса по authorize_url и token_url способа oauth2 — ни при открытии витрины, ни
      при открытии страницы коннектора, ни при попытке подключения

  - id: AC-314
    rule: [S-V28]
    type: unit
    given: >
      функция доступности способа (packages/opencode/src/corp/status.ts) и способ oauth2 с
      available:true
    when: условие «в» таблицы S-V28 п. 1 отключено в вызове функции (снятие запрета)
    then: >
      тот же способ становится доступным (available == true, unavailable_code == null) БЕЗ правки
      экранов, роутов, словарей и контракта каталога; способ oauth2, которому каталог оставил
      available:false, остаётся закрытым по строке «а» с unavailable_code == "catalog_unavailable" —
      снятие запрета не отменяет решения каталога

  - id: AC-315
    rule: [S-V25]
    type: integration
    given: >
      карточка с upstream и доступным способом user_token; мок целевой системы отвечает 200 и телом,
      в котором по verify.account_field лежит "ivanov"
    when: выполнен POST /corp/connectors/:alias/connect-token с корректным токеном
    then: >
      выполнен РОВНО ОДИН запрос проверки — метод и адрес из verify, заголовки из verify.headers с
      подставленным {{access_token}}; в переданном клиентом наборе заголовков нет ключа magnit_prod и
      нет ни одного нашего заголовка, кроме Accept и User-Agent (проверяется по перехваченному объекту
      заголовков запроса, а НЕ по сокету: Host, Connection и Accept-Encoding среды выполнения
      правилом не ограничиваются); ответ роута содержит verify_result:"verified" и account:"ivanov";
      значения токена в ответе нет

  - id: AC-316
    rule: [S-V25, S-Q4]
    type: integration
    given: >
      пять моков целевой системы: 200 с ожидаемым телом; 200 при require_account:true с пустым
      account_field; 401; 500; таймаут без ответа
    when: на каждом выполнен POST …/connect-token
    then: >
      verify_result принимает ПЯТЬ РАЗНЫХ значений — verified, account_missing, token_rejected,
      verify_failed, upstream_unreachable — и ни одна пара не совпадает; в частности token_rejected
      != verify_failed («система сказала нет» и «система ответила не то») и verify_failed !=
      upstream_unreachable («ответ был» и «ответа не было»); показанные тексты у всех пяти различны
      (сравнение попарное, а не «текст непустой»); при любом исходе кроме verified в конфиге НЕТ
      ключа mcp.<alias>, в файле хранилища нет записи и признак «подключение состоялось» не поставлен
    negative: true

  - id: AC-317
    rule: [S-V25]
    type: integration
    given: способ с verify.require_account:true; целевая система отвечает 200 телом без account_field
    when: выполнен POST …/connect-token
    then: >
      verify_result == "account_missing", а НЕ "verified": успешный код без названного пользователя
      подтверждением не является; токен не сохранён, mcp.<alias> не создан; тело, не разобранное как
      JSON, при том же коде даёт тот же исход account_missing, а не verify_failed
    negative: true

  - id: AC-318
    rule: [S-V25]
    type: integration
    given: >
      способ с объявленным блоком exchange; четыре мока обмена: 200 с непустым token_field; 403;
      200 с пустым token_field; таймаут. Проверка во всех четырёх случаях успешна
    when: на каждом выполнен POST …/connect-token
    then: >
      exchange_result принимает ЧЕТЫРЕ РАЗНЫХ значения — exchanged, exchange_denied, exchange_failed,
      exchange_unreachable; при exchanged в хранилище лежит ВЫПУЩЕННЫЙ токен с issued:true и
      token_id; в остальных трёх — введённый пользователем токен с issued:false; во всех четырёх
      случаях подключение СОСТОЯЛОСЬ (mcp.<alias> записан), а три неуспешных исхода отрисованы как
      ПРЕДУПРЕЖДЕНИЕ, а не как ошибка (проверяется по разметке, а не по тексту); способ без блока
      exchange даёт exchange_result:null и не показывает ничего
    negative: true

  - id: AC-319
    rule: [S-V25, S-Q4]
    type: integration
    given: >
      снимок конфига и хранилища; шесть тел запроса: не объект; без token; token пустой; token короче
      field.min_length; method не указан при двух способах user_token; method неизвестен
    when: на каждом выполнен POST …/connect-token
    then: >
      каждый даёт 400 {error:"invalid_request", message} ДО единого исходящего запроса; неизвестный
      alias даёт 404; карточка без разобранного upstream даёт 409 {error:"direct_unavailable"};
      после всех шести конфиг и файл хранилища побайтово те же, что в снимке
    negative: true

  - id: AC-320
    rule: [S-V25, S-V26]
    type: integration
    given: >
      карточка mode:"facade" с mcp_url, указывающим на прокси (…/mcp/<alias>), и с upstream.url,
      указывающим на MCP-сервер целевой системы; проверка успешна
    when: выполнено прямое подключение
    then: >
      в глобальном конфиге mcp.<alias> == {type:"remote", url:<upstream.url>, enabled:true} — url
      равен upstream.url и НЕ равен mcp_url; ключа oauth нет; ключа headers нет (его не было и не
      появилось); соединение MCP поднято по адресу upstream.url

  - id: AC-321
    rule: [S-V26]
    type: unit
    given: успешное прямое подключение маркерным токеном
    when: прочитаны файл хранилища и все файлы конфигурации на диске
    then: >
      файл Global.Path.data/corp/connector-credentials.json существует и содержит запись alias с
      полями upstream_url, method_id, token, issued, saved_at; на POSIX права файла — 0o600 (на
      платформе без поддержки прав проверяется, что неуспех chmod записи НЕ отменил и ушёл
      предупреждением в лог); ни один файл конфигурации подстроки маркерного токена не содержит

  - id: AC-322
    rule: [S-V26]
    type: integration
    given: >
      сохранённая запись с upstream_url == "https://a.example/mcp"; каталог отдал ту же карточку с
      upstream.url == "https://b.example/mcp"
    when: открыта витрина и предпринята попытка подключения
    then: >
      запись НЕ применяется: учётные заголовки к запросу не подставляются, карточка показана в
      состоянии «нужно ввести токен заново» (corp.connect.credentialsMissing), блок подключения
      отрисован; токен на новый адрес не отправлен ни разу; прежняя запись затирается только
      следующим успешным сохранением
    negative: true

  - id: AC-323
    rule: [S-V26, S-B6]
    type: integration
    given: >
      сохранённая запись; upstream.static_headers = {X-Src: "catalog"}; у пользователя в конфиге
      mcp.<alias>.headers = {X-Src: "user", Authorization: "Bearer stale"};
      upstream.credential_headers = {Authorization: "Bearer {{access_token}}"}
    when: поднимается транспорт MCP
    then: >
      итоговый набор заголовков собран в порядке static → config → credential: X-Src == "user"
      (конфиг победил каталог), Authorization содержит СОХРАНЁННЫЙ токен, а не "stale" (учётный
      заголовок побеждает конфиг); пользовательский ключ mcp.<alias>.headers в конфиге не изменён;
      значение токена в конфиг не записано

  - id: AC-324
    rule: [S-V26]
    type: integration
    given: каталог данных недоступен для записи (права сняты); проверка токена успешна
    when: выполнен POST …/connect-token
    then: >
      ответ 500 {error:"storage_unavailable", message}; ключ mcp.<alias> в конфиг НЕ записан;
      соединение не поднято; карточка НЕ показана подключённой; значение токена в ответе, логе и
      событиях отсутствует. Отличие от кэша каталога и признака подключений намеренное: там отказ
      записи не фатален, здесь — фатален (S-V26 п. 5)
    negative: true

  - id: AC-325
    rule: [S-V26]
    type: integration
    given: файл хранилища существует, но содержит битый JSON
    when: открыта витрина и страница коннектора
    then: >
      витрина открывается, карточки показаны; затронутая карточка — в состоянии «нужно ввести токен
      заново» с отрисованным блоком подключения; предупреждение ушло в лог; файл НЕ удалён
      автоматически и перезаписывается только следующим успешным сохранением
    negative: true

  - id: AC-326
    rule: [S-V26, S-Q14]
    type: integration
    given: >
      прямое подключение выполнено маркерным токеном MARKER-<uuid4>, уникальным в пределах теста;
      за сеанс перехвачены вывод логгера всех уровней, события шины и тела ВСЕХ ответов корп-роутов
    when: >
      после подключения прочитаны перехваченное, отчёт corp/diagnostics.ts, вывод `opencode corp
      status`, ответы GET /corp/catalog, GET /corp/status, GET /config и файлы конфигурации на диске
    then: >
      подстроки маркера нет НИ В ОДНОМ из перечисленных мест; в лог попало ИМЯ учётного заголовка и
      не попало его значение; при смоделированном отказе целевой системы в лог попали alias и код
      ответа и не попало тело ответа; наружу о хранилище видно ровно has_credentials:true и account.
      Критерий проверяет отсутствие подстроки МАРКЕРА, а не отсутствие слова «token»: строки
      token_rejected и connect-token в логе законны, и запрет на них покраснел бы на верной реализации
    negative: true

  - id: AC-327
    rule: [S-V27]
    type: integration
    given: >
      прямое подключение с issued:true и token_id; у способа объявлен блок revoke; три мока отзыва:
      успешный код, 500, таймаут
    when: на каждом выполнено действие «Отключить»
    then: >
      revoke принимает три РАЗНЫХ значения — revoked, not_revoked, unreachable (not_revoked !=
      unreachable: «ответ был» и «ответа не было»); запись хранилища удалена ВО ВСЕХ ТРЁХ случаях,
      включая неуспешные; записи прочих коннекторов не тронуты; неуспех отзыва отрисован как
      предупреждение, а не как ошибка; шага обращения по адресу Hub нет ни в одном случае — ни при
      заданном адресе Hub, ни при незаданном
    negative: true

  - id: AC-328
    rule: [S-V27, S-Q4]
    type: integration
    given: >
      два прямых подключения: одно с issued:false (токен введён пользователем), второе с issued:true
      у способа без блока revoke
    when: на обоих выполнено «Отключить»
    then: >
      в обоих случаях revoke == "skipped" и НЕ "unreachable" — запроса отзыва не выполнено вовсе
      (проверяется перехватом: исходящих запросов ноль), и пользователю про отзыв не показано ничего;
      запись хранилища удалена; чужой токен приложение не отзывает, а только забывает
    negative: true

  - id: AC-329
    rule: [S-V27, S-V17]
    type: integration
    given: прямое подключение с issued:true и объявленным revoke
    when: выполнено «Убрать из списка» (DELETE /corp/connectors/:alias) с подтверждением
    then: >
      выполнены отзыв (по правилам AC-327), удаление записи хранилища, удаление ключа mcp.<alias> из
      конфига и удаление alias из файла признака подключений; прочие ключи конфига не тронуты;
      обращений по адресу Hub нет при любом его значении; карточка перешла в состояние 1 таблицы
      S-V16 и осталась в витрине

  - id: AC-330
    rule: [S-V29, S-V7, S-D13]
    type: integration
    given: карточка с connect_mode:"direct", подключённая прямым способом (состояние 4 таблицы S-V16)
    when: открыта страница коннектора, затем выполнено «Отключить», затем страница открыта снова
    then: >
      в состоянии 4 блока подключения на странице НЕТ и показано «Отключить»; после отключения блок
      подключения отрисован снова; подключить тот же alias фасадным способом, пока действуют прямые
      учётные данные, нельзя — попытка отвергается без правки конфига; молчаливого переключения
      способа не происходит ни при каком изменении каталога
    negative: true

  - id: AC-331
    rule: [S-V29, S-V19]
    type: integration
    given: >
      сборка подключилась прямым способом при незаданном адресе Hub; затем адрес Hub задан, и Hub
      отдаёт для того же alias connection.status:"not_connected"
    when: открыты витрина и страница коннектора, затем целевая система отвечает 401 на запрос MCP
    then: >
      запись mcp.<alias> и запись хранилища не изменены, соединение продолжает работать напрямую; в
      сторону Hub не отправлено ни токена, ни сведений о подключении; поле connection карточки на её
      состояние не влияет — карточка считается подключённой прямым способом (S-V29 п. 4); при отказе
      401 карточка получает error_class "token_rejected" по S-V19 (правило не изменено), а
      предлагаемое действие — «Ввести токен заново», открывающее ту же форму
    negative: true

  - id: AC-332
    rule: [S-D13]
    type: unit
    given: >
      карточка connect_mode:"direct" со способом, у которого field.secret:true, заданы hint и
      docs_url, min_length 20
    when: отрисован блок подключения и предприняты попытки ввода
    then: >
      поле имеет type="password" и ПУСТОЕ значение при каждом открытии (предзаполнения нет ни
      сохранённым токеном, ни маской); отрисованы подпись field.label, подсказка field.hint и ссылка
      docs_url; при пустом поле кнопка неактивна и запроса нет; при значении длиной 19 показано
      сообщение corp.connect.tooShort и запрос НЕ уходит; при отсутствующем hint строка подсказки не
      рисуется вовсе (пустой строки не появляется)
    negative: true

  - id: AC-333
    rule: [S-D13, S-Q9]
    type: unit
    given: страница коннектора открыта, ответ GET /corp/catalog ещё не получен
    when: снят снимок дерева до ответа, затем после ответа с connect_mode:"direct" и с "native"
    then: >
      до ответа блока подключения в дереве НЕТ — и утверждения «форма всегда на экране» критерий не
      делает; после ответа с "direct" блок есть; после ответа с "native" блока нет вовсе (не пустого
      блока и не заглушки)
    negative: true

  - id: AC-334
    rule: [S-D13]
    type: unit
    given: блок подключения с отправленной формой
    when: получены исходы verify_result и exchange_result и выполнено повторное нажатие кнопки
    then: >
      исход отрисован В ТОМ ЖЕ блоке (не всплывающим окном, не на витрине, не в другой части
      страницы); неуспешный исход проверки сохранил введённое значение в поле; повторное нажатие во
      время запроса второго запроса не создало; после успеха блок заменён признаком «Подключено» и
      строкой с account, а действие «Заменить токен» открывает ту же ПУСТУЮ форму; значение токена
      не показано ни на одном экране

  - id: AC-335
    rule: [S-T12, S-Q9]
    type: unit
    given: те же данные карточки в TUI
    when: открыт экран подключения TUI и пройдены те же сценарии, что в AC-312, AC-316, AC-318
    then: >
      TUI отправляет ТОТ ЖЕ роут POST /corp/connectors/:alias/connect-token; ввод маскирован при
      field.secret != false; недоступный способ показан строкой, которую нельзя выбрать, с текстом
      причины; пять исходов проверки и четыре исхода обмена различимы попарно и ни один набор не
      схлопнут в «получилось / не получилось»; docs_url показан текстом (браузер не открывается);
      введённое значение не попало ни в историю команд, ни в лог TUI

  - id: AC-336
    rule: [S-I1, S-I3, S-I4, S-Q9]
    type: unit
    given: словари en.ts, ru.ts и словарь TUI
    when: перечислены ключи ревизии 1.13 и отрисованы все ветви блока подключения в сборке без Hub
    then: >
      все ключи ревизии 1.13 присутствуют в трёх словарях, значения ru и en различны; при исходе
      revoke:"skipped" в отрисованном дереве НЕТ ни одного текста об отзыве — проверяется по
      отрисованному, а не по составу словарей (наличия или отсутствия ключа под этот исход критерий
      не требует ни в ту, ни в другую сторону); ни в одной отрисованной ветви — выбор способа, форма, пять исходов проверки, четыре
      исхода обмена, три исхода отзыва, три причины недоступности, «Заменить токен» — нет подстроки
      «Hub» без учёта регистра, ни в одном из двух языков, ни в app, ни в TUI; перечни исходов и
      причин тест берёт из тех же перечислимых типов, которыми они объявлены в коде, поэтому новое
      значение без новой ветви ВАЛИТ тест
    negative: true

  - id: AC-337
    rule: [S-V24]
    type: manual
    given: опубликованный статический каталог и публичное представление Hub (задача репозитория Hub)
    when: прочитано содержимое опубликованного каталога
    then: >
      у способов type:"user_token" опубликованы field, verify, exchange, revoke и серверные
      upstream.url, credential_headers, static_headers; у способов type:"oauth2" не опубликовано
      ничего из перечисленного, включая client_secret, token_url и scopes; ни одного развёрнутого
      значения env:VAR нет ни при каком типе способа; ни одного client_secret в опубликованном
      каталоге нет. Клиент на это требование НЕ полагается: заголовок со значением env:… он и сам
      объявляет недоступным (AC-309)
    negative: true


  # ------------------------------------------------------ микроревизия 1.13.1 (запрет native)

  - id: AC-338
    rule: [S-V28, S-V7, S-V3]
    type: unit
    given: >
      каталог с карточкой mode:"native" (alias=native_srv, разобранное ядро, permission_model
      разобрана), запрет OAuth действует
    when: запрошен GET /corp/catalog, затем приложение перезапущено и каталог прочитан из кэша
    then: >
      карточка ПРИСУТСТВУЕТ в servers[] со своими alias, title, status и permission_model и НЕ
      присутствует в dropped[] — она разобрана, а не выброшена; connect_mode == "none" и
      connect_mode_unavailable_code == "oauth_disabled"; в файле кэша поле mode лежит дословно
      "native" (не подменено на "facade" и не удалено), и после перезапуска карточка читается тем же
      значением. Реализация, выбрасывающая native-карточки при разборе или подменяющая их mode,
      критерий НЕ проходит, хотя внешне даёт тот же экран (S-V28 п. 6)

  - id: AC-339
    rule: [S-V28, S-V7]
    type: integration
    given: >
      карточка mode:"native" с mcp_url; снимок глобального конфига и файла хранилища учётных данных
      снят до вызова; перехвачены исходящие запросы и вызовы открытия браузера
    when: >
      выполнен POST /corp/connectors/native_srv/connect с телом {preset:"readonly"} — запрос послан
      МИМО интерфейса, как это сделал бы curl или скрипт
    then: >
      ответ 409 {error:"auth_method_unavailable", unavailable_code:"oauth_disabled", message};
      за сценарий НЕТ НИ ОДНОГО исходящего запроса — ни discovery
      (/.well-known/oauth-authorization-server, /.well-known/openid-configuration), ни регистрации
      клиента DCR, ни по authorize, ни по token, ни по mcp_url; браузер не открыт ни разу;
      глобальный конфиг и файл хранилища побайтово те же, что в снимке — ключ mcp.native_srv не
      создан и не изменён. Проверяется перехватом запросов и снимком файлов, а не только кодом
      ответа
    negative: true

  - id: AC-340
    rule: [S-V28, S-V9]
    type: integration
    given: >
      подключённая карточка mode:"native" с connect_mode_unavailable_code == "oauth_disabled"; мок
      Hub отвечает на PUT прав полем reauth_required: true
    when: выполнен PUT /corp/connectors/native_srv/permissions с телом {preset:"readwrite"}
    then: >
      ответ 200 с ПРЕЖНИМИ полями и reauth_required: true — нового поля в ответе роута не
      появилось; шаг 2 правила S-V7 НЕ запущен: браузер не открыт, ни одного исходящего запроса по
      OAuth-адресам MCP-сервера нет; запись прав в Hub при этом ВЫПОЛНЕНА — запретом закрыт
      браузерный шаг, а не выбор пресета; mcp.native_srv.oauth.scope не появился; причину экран
      берёт из connect_mode_unavailable_code карточки и рисует на месте приглашения авторизоваться
    negative: true

  - id: AC-341
    rule: [S-V28, S-D13, S-V7, S-Q9]
    type: unit
    given: >
      два набора данных страницы коннектора: (1) connect_mode:"none" с
      connect_mode_unavailable_code:"oauth_disabled"; (2) connect_mode:"none" с
      connect_mode_unavailable_code:"facade_needs_hub"
    when: отрисована страница коннектора
    then: >
      набор (1) — действие «Подключить» ПРИСУТСТВУЕТ в дереве с атрибутом disabled, текст причины
      corp.connectors.methodUnavailable.oauthDisabled отрисован в том же блоке рядом с ним, блока
      ввода токена нет вовсе (ни пустого, ни заглушки); набор (2) — действия в дереве НЕТ, а на его
      месте прежний текст corp.connectors.facadeNeedsHub (поведение ревизии 1.11 дословно, AC-252
      не затронут). Две ветви проверяются КАК РАЗЛИЧИЕ: реализация, ветвящаяся по одному лишь
      connect_mode == "none" и дающая обоим наборам одинаковое дерево, критерий НЕ проходит.
      Спрятанное (не отрисованное вовсе) действие в наборе (1) критерий НЕ проходит. Наборы
      действий таблицы ACTIONS (S-V16) при этом НЕ изменились: неактивное действие оболочка рисует
      по паре connect_mode + connect_mode_unavailable_code, и проверки составов наборов
      (AC-170, AC-173, AC-185, AC-188, AC-249) остаются зелёными без правок. Третье значение набора,
      no_method, в перебор НЕ входит: на данных действующего контракта (mode ∈ {native, facade}) оно
      недостижимо и объявлено только для тотальности разбора (S-V28 п. 2) — требовать его случай
      значило бы требовать данных, которых на верной реализации не бывает
    negative: true

  - id: AC-342
    rule: [S-V28, S-V7]
    type: unit
    given: >
      функции доступности и выбора способа (packages/opencode/src/corp/status.ts); способ oauth2 с
      available:true и карточка mode:"native" — оба закрыты действующим запретом
    when: предикат oauthDisabled() переключён в «запрет снят» — ОДНО изменение, других нет
    then: >
      способ oauth2 становится доступным (available == true, unavailable_code == null) И одновременно
      карточка mode:"native" получает connect_mode == "native" с connect_mode_unavailable_code ==
      null — оба запрета сняты ОДНИМ переключением, согласованно; при этом не правились ни экраны,
      ни роуты, ни словари, ни контракт каталога; способ oauth2, которому каталог оставил
      available:false, остаётся закрытым по строке «а» с unavailable_code == "catalog_unavailable",
      а карточка mode:"facade" без адреса Hub остаётся с connect_mode_unavailable_code ==
      "facade_needs_hub" — снятие запрета не отменяет ни решения каталога, ни отсутствия Hub

  - id: AC-343
    rule: [S-V28, S-C10]
    type: integration
    given: >
      сборка с пустым CORP_HUB_URL и заданным CORP_CATALOG_URL; статический каталог содержит
      карточку mode:"native", карточку mode:"facade" и карточку с доступным способом user_token
    when: >
      за один сеанс открыта витрина, открыта страница каждого коннектора, предпринята попытка
      подключить native-карточку и выполнено прямое подключение токеном
    then: >
      прямое подключение выполнено успешно — это ЕДИНСТВЕННЫЙ работающий способ в такой сборке;
      за весь сеанс нет ни одного исходящего запроса по authorize_url и token_url способа oauth2,
      ни одного по OAuth-адресам MCP-сервера native-карточки (discovery, DCR, authorize, token) и
      ни одного по адресу Hub; ни одно действие витрины браузер не открыло (вход по SSO в сеанс
      сценария не входит и этой проверкой не ограничивается); обе закрытые карточки видны в витрине
      с названными причинами и из списка не пропали
    negative: true

  - id: AC-344
    rule: [S-V28, S-T12]
    type: unit
    given: одни и те же данные карточки mode:"native" с закрытым подключением, поданные Desktop и TUI
    when: обе оболочки отрисовали страницу коннектора и список действий
    then: >
      connect_mode и connect_mode_unavailable_code у обеих совпадают, потому что обе берут их из
      ответа роута и сами не вычисляют (S-V28 п. 3); в TUI строка действия «Подключить»
      ПРИСУТСТВУЕТ и не выбирается — нажатие enter не меняет ни конфига, ни состояния и показывает
      ту же причину из словаря TUI; из списка действий строка не исчезает; тексты причины в обеих
      оболочках нормализуются к одному значению (S-T10) и слова «Hub» не содержат

  - id: AC-345
    rule: [S-V28, S-B6]
    type: ci
    given: реестр правок upstream corp/patches.md и дерево файлов upstream
    when: выполнена проверка реестра (S-Q7) после реализации запрета S-V28
    then: >
      в corp/patches.md нет ни одной записи, ссылающейся на S-V28; файл, содержащий роут
      POST /mcp/:A/auth/authenticate, и файл packages/opencode/src/mcp/auth.ts в диффе ветки
      относительно базового тега upstream НЕ изменены. Запрет живёт в корп-роутах и корп-коде, и
      правило это объявляет, а не умалчивает (S-V28 п. 5). Критерия «запрос по upstream-роуту тоже
      отвечает 409» НЕТ намеренно: на верной реализации, не трогающей upstream, такой тест
      краснел бы. Единственная правка upstream, оплаченная ревизией 1.13, — шов подстановки
      заголовков в mcp/index.ts (D-60), и запрет к ней ничего не добавляет
    negative: true

  # ------------------------- errata 1.13.1: паритет ряда TUI (находка H-3 review-i4-rev112-3)

  - id: AC-346
    rule: [S-T11, S-A16, S-Q9]
    type: unit
    given: >
      витрина коннекторов TUI и её список действий в четырёх прогонах: GET /corp/status отдаёт
      authenticated:true; authenticated:false при каталоге БЕЗ hub_error (статический каталог либо
      недоступный Hub); authenticated:true при каталоге с hub_error:"unauthorized"; статус ещё не
      получен (значение признака не известно)
    when: >
      проверено, какой из двух пунктов списка действий показан — «Войти» (dialog.corp.login) или
      «Выйти» (dialog.corp.logout)
    then: >
      в первом прогоне показан пункт «Выйти», пункта «Войти» нет; во втором показан «Войти», хотя
      hub_error каталога пуст — признак берётся из authenticated и ни из чего другого; в третьем
      показан «Выйти», хотя hub_error каталога равен "unauthorized"; в четвёртом не показан НИ ОДИН
      из двух — значений у признака три, и «один из двух всегда в списке» не утверждается;
      одновременно оба не показаны ни в одном прогоне. Критерий-близнец AC-287: та же таблица
      значений и те же четыре прогона, но для оболочки TUI — AC-287 привязан к S-D6, то есть только
      к Desktop, и паритет S-T11 проверять было нечем (H-3 ревью review-i4-rev112-3). Выражения
      видимости берутся из исходника витрины TUI и исполняются, а не пересказываются в тесте
      (S-Q9 п. (щ)). Ни ряд заголовка Desktop, ни AC-287 этим критерием не затрагиваются
    negative: true

