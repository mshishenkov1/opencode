      завершилась ошибкой
    when: карточка перестроена после неудачной попытки
    then: >
      запись mcp.<alias> в конфиге осталась (S-V7 п.4), признак «подключение состоялось» НЕ выставлен,
      карточка показывает объяснение ошибки и предлагаемое действие, набор действий — только
      «Подключить» и «Открыть в Hub»; слово «Отключить» на карточке не появляется ни в каком виде
    negative: true

  - id: AC-173
    rule: [S-V15, S-V16]
    type: unit
    given: >
      alias, для которого признак «подключение состоялось» истинен (локальный статус connected
      наблюдался ранее), сейчас локальный статус failed с текстом ошибки
    when: вычислена модель карточки
    then: >
      состояние «Соединение потеряно»; действия — «Повторить» и «Убрать из списка»; действия
      «Отключить» нет; «Открыть в Hub» доступно; подпись содержит текст ошибки

  - id: AC-174
    rule: [S-V16, S-V15]
    type: unit
    given: карточка каталога с connection.status = needs_reauth, локальной истории подключений нет
    when: вычислена модель карточки
    then: >
      признак «подключение состоялось» истинен (запись подключения Hub создаётся только после успешной
      авторизации), состояние «Соединение потеряно», действия — «Повторить» и «Убрать из списка»,
      статус карточки needs_auth (AC-52 не изменён)

  - id: AC-175
    rule: [S-V17]
    type: unit
    given: подключавшийся ранее сервер gitlab в состоянии «Соединение потеряно»
    when: выполнено «Убрать из списка» и подтверждено
    then: >
      вызваны по порядку DELETE /mcp/gitlab/auth, POST /mcp/gitlab/disconnect, Config.updateGlobal с
      УДАЛЕНИЕМ ключа mcp.gitlab (а не enabled=false), DELETE {hub}/api/me/connections/gitlab;
      alias удалён из файла признака подключений; прочие ключи конфига пользователя не изменены;
      карточка перешла в состояние «Не подключён» и осталась в витрине

  - id: AC-176
    rule: [S-V17]
    type: unit
    given: Hub недоступен (таймаут) на шаге DELETE /api/me/connections/gitlab
    when: выполнено «Убрать из списка»
    then: >
      локальные шаги выполнены, ключ mcp.gitlab из конфига удалён, признак подключения снят,
      ответ содержит hub_error, показано предупреждение; локальные шаги не откачены
    negative: true

  - id: AC-177
    rule: [S-V18, S-V16, S-V8]
    type: unit
    given: локальный статус connected
    when: отрисована карточка витрины
    then: >
      на карточке есть отдельный визуальный признак подключения — бейдж «Подключено» тем же средством
      и размером, что бейдж «устаревший», а не только подпись статуса мелким вспомогательным шрифтом;
      кнопки «Подключить» нет; действия — «Отключить», «Права», «Открыть в Hub» (AC-53 не изменён)

  - id: AC-178
    rule: [S-V15, S-V8]
    type: unit
    given: >
      alias был подключён (признак выставлен и записан в файл), затем выполнено «Отключить» (S-V8),
      затем приложение перезапущено
    when: открыта витрина и вычислена модель карточки
    then: >
      признак «подключение состоялось» по-прежнему истинен — «Отключить» его не снимает и перезапуск
      его не теряет; карточка показывает подпись «Отключено вами» (не «Соединение потеряно») и
      действия «Повторить» и «Убрать из списка»; действия «Отключить» на ней нет

  - id: AC-179
    rule: [S-V15]
    type: unit
    given: >
      файл признака подключений отсутствует или повреждён, каталог Hub отдаёт карточку с
      connection.status = connected
    when: вычислен признак «подключение состоялось»
    then: >
      признак истинен по данным Hub; повреждённый файл трактуется как отсутствующий, витрина
      открывается, ошибка чтения записана в лог; при отсутствии и файла, и connection признак ложен
    negative: true

  - id: AC-180
    rule: [S-V19]
    type: unit
    given: >
      подключение завершилось отказом авторизации (OAuth invalid_grant; отдельно 401 от MCP-прокси
      Hub; отдельно JSON-RPC error.data.reason = needs_reauth)
    when: сформирован ответ POST /corp/connectors/:alias/connect и перестроена карточка
    then: >
      во всех трёх случаях error_class = token_rejected; пользователю показано объяснение «авторизация
      не принята» и предложено повторить авторизацию, дополнительно «Открыть в Hub»; тело ответа Hub,
      ключ и poll_secret в тексте отсутствуют
    negative: true

  - id: AC-181
    rule: [S-V19]
    type: unit
    given: >
      Hub отказал в регистрации клиента (DCR) либо локальный статус needs_client_registration
    when: сформирован ответ connect
    then: >
      error_class = method_unavailable; показано объяснение, что этим способом коннектор подключить
      нельзя, и предложено «Открыть в Hub»; действие «Повторить авторизацию» первичным не предлагается
    negative: true

  - id: AC-182
    rule: [S-V19]
    type: unit
    given: подключение не удалось из-за сети или Hub (таймаут, сетевая ошибка, 502, hub_invalid_response)
    when: сформирован ответ connect
    then: >
      error_class = hub_unreachable; показано объяснение, что связаться с Hub не удалось и настройки
      пользователя ни при чём; предложено «Повторить»
    negative: true

  - id: AC-183
    rule: [S-V19]
    type: unit
    given: подключение завершилось ошибкой, не отнесённой ни к одному из трёх классов
    when: сформирован ответ connect
    then: >
      error_class = unknown; карточка всё равно показывает текст с кодом ошибки и предлагаемое
      действие «Повторить»; состояния «ошибка без объяснения» не существует ни при какой ошибке
    negative: true

  - id: AC-184
    rule: [S-D10, S-Q9]
    type: unit
    given: >
      витрина открыта в обеих ветках флага «New layout and designs» с нулём карточек, с одной
      карточкой и с полусотней карточек
    when: измерена высота видимой панели окна
    then: >
      высота одинакова во всех трёх случаях внутри одной ветки и совпадает с высотой окна настроек той
      же ветки; появление баннера «Hub недоступен», предупреждения об отброшенных карточках и любого из
      четырёх пустых состояний высоту не меняет; список прокручивается внутри окна; окну не передан fit

  - id: AC-185
    rule: [S-T10, S-V16]
    type: unit
    given: те же входы, что в AC-170, AC-171, AC-173 и AC-177, поданы экрану витрины TUI
    when: построен список коннекторов
    then: >
      TUI показывает те же четыре состояния и те же наборы действий, что Desktop, взяв их из общего
      модуля corp/status.ts; подпись действия в состоянии «Соединение потеряно» — «Повторить»,
      в состояниях «Не подключён» и «Подключение не удалось» — «Подключить»; подключённая карточка
      помечена маркером, читаемым без цвета

  - id: AC-186
    rule: [S-T10]
    type: unit
    given: карточка TUI в состоянии «Не подключён», «Подключение не удалось» и «Соединение потеряно»
    when: нажата клавиша d («Отключить»)
    then: >
      ни в одном из трёх состояний отключение не выполняется, конфиг не меняется, показана подсказка,
      что подключения нет; клавиша x («Убрать из списка») действует только в состоянии «Соединение
      потеряно»
    negative: true

  - id: AC-187
    rule: [S-I1, S-I3, S-V19]
    type: unit
    given: словари packages/app/src/i18n/en.ts и ru.ts и словарь TUI
    when: выполнен тест паритета
    then: >
      ключи corp.connectors.connected, corp.connectors.retry, corp.connectors.forget,
      corp.connectors.forgetConfirm, corp.connectors.forgetHubFailed, corp.connectors.neverConnected,
      corp.connectors.lost, corp.connectors.disconnected, corp.error.connect.token_rejected, corp.error.connect.method_unavailable,
      corp.error.connect.hub_unreachable, corp.error.connect.unknown и corp.upgrade.disabled есть в
      обоих словарях, значения ru не равны значениям en, те же тексты есть в словаре TUI

  - id: AC-188
    rule: [S-Q4, S-Q9, S-V15, S-V16]
    type: unit
    given: тесты витрины packages/opencode/src/corp/connectors.test.ts и status.test.ts
    when: тесты выполнены
    then: >
      покрыта каждая строка таблицы S-V16, причём для состояний «Подключение не удалось» и «Соединение
      потеряно» — парой случаев с ОДИНАКОВЫМ локальным статусом и разным признаком S-V15; ни в одном
      случае состояний 1–3 набор действий не содержит disconnect; покрыты выставление признака по
      локальному connected и по connection.status Hub, его сохранение при «Отключить» и снятие при
      «Убрать из списка»

  - id: AC-189
    rule: [S-B13, S-B9]
    type: unit
    given: packages/desktop/electron-builder.config.ts, OPENCODE_CHANNEL=magnit
    when: вычислена конфигурация упаковки
    then: >
      extraMetadata.name = "opencode-magnit-desktop", extraMetadata.desktopName сохранён из getBase()
      (ai.opencode.desktop.magnit.desktop); проверки AC-138 (appId, productName, artifactName,
      rpm.packageName, protocols.name, отсутствие legacyDesktopEntryFpm) продолжают выполняться
      без изменений

  - id: AC-190
    rule: [S-B13, S-B9]
    type: unit
    given: OPENCODE_CHANNEL=dev, beta и prod
    when: вычислена конфигурация упаковки
    then: >
      extraMetadata каждого из трёх каналов совпадает с upstream-значением (только desktopName, поля
      name в нём нет), то есть каталог кеша обновлений ванильных каналов не изменился;
      правка ограничена веткой magnit (S-B9)

  - id: AC-191
    rule: [S-B13]
    type: manual
    given: собранная корпоративная сборка Desktop канала magnit с заданным CORP_DESKTOP_UPDATE_URL
    when: осмотрен app-update.yml в ресурсах бандла и каталоги кеша после запуска и проверки обновлений
    then: >
      app-update.yml содержит updaterCacheDirName: opencode-magnit-desktop-updater и не содержит
      подстроки @opencode-aidesktop-updater; в кеше ОС создан каталог opencode-magnit-desktop-updater;
      каталог @opencode-aidesktop-updater корпоративной сборкой не создан, не прочитан и не очищен

  - id: AC-192
    rule: [S-Q10, S-B13]
    type: unit
    given: тест конфигурации упаковки Desktop
    when: тест выполнен
    then: >
      к покрытию AC-152 добавлены случаи каталога кеша: extraMetadata.name канала magnit и
      неизменённый extraMetadata каналов dev, beta, prod; прежние случаи AC-152 (каналы, неизвестное
      значение, незаданная переменная, обе ветки фида обновлений) продолжают проверяться

  - id: AC-193
    rule: [S-B14]
    type: unit
    given: корп-функции включены, CORP_CLI_UPDATE_URL не задан, HTTP-клиент подменён перехватчиком
    when: выполнена команда opencode upgrade
    then: >
      не выполнено ни одного сетевого запроса (в частности к api.github.com, registry.npmjs.org,
      formulae.brew.sh, community.chocolatey.org, raw.githubusercontent.com) и не запущен ни один
      менеджер пакетов; напечатано сообщение corp.upgrade.disabled о централизованном обновлении;
      код выхода 1
    negative: true

  - id: AC-194
    rule: [S-B14]
    type: unit
    given: корп-функции включены, CORP_CLI_UPDATE_URL = https://dist.test/opencode
    when: выполнена команда opencode upgrade без явной цели
    then: >
      единственный запрос определения версии — GET https://dist.test/opencode/latest, ответ разобран
      как {version}; артефакт скачан с того же хоста; к api.github.com и публичным реестрам обращений
      нет ни на одном шаге; при совпадении версии с текущей апгрейд пропущен без сетевой установки

  - id: AC-195
    rule: [S-B14]
    type: unit
    given: корп-функции включены, адрес задан, ответ https://dist.test/opencode/latest не соответствует схеме
    when: выполнена команда opencode upgrade
    then: >
      напечатана понятная ошибка источника обновлений, бинарник не заменён, обращения к api.github.com
      как запасному источнику нет, код выхода 1
    negative: true

  - id: AC-196
    rule: [S-B14, S-Q11]
    type: unit
    given: корп-функции выключены (ванильная сборка, S-C6)
    when: выполнена команда opencode upgrade
    then: >
      поведение полностью upstream — версия определяется прежним путём, корп-сообщение не печатается,
      код выхода прежний

  - id: AC-197
    rule: [S-B15]
    type: unit
    given: упакованная сборка Desktop канала magnit
    when: создано главное окно
    then: >
      заголовок окна равен "OpenCode Magnit" — тому же значению, что APP_NAMES[CHANNEL] и productName
      канала; строки "OpenCode" без суффикса заголовок окна не содержит

  - id: AC-198
    rule: [S-B15]
    type: unit
    given: каналы dev, beta, prod и неупакованный запуск
    when: вычислен заголовок окна
    then: >
      заголовки равны "OpenCode Dev", "OpenCode Beta", "OpenCode" соответственно, неупакованный запуск
      даёт "OpenCode Dev"; заголовок берётся из той же таблицы имён и того же канала (resolveChannel →
      build-константа), второй копии разбора канала и второй таблицы имён в коде нет

  - id: AC-199
    rule: [S-Q11, S-Q10]
    type: unit
    given: тесты явного апгрейда CLI и заголовка окна
    when: тесты выполнены
    then: >
      список запрещённых хостов задан явно и проверяется по всем перехваченным запросам, а не по
      одному; покрыты обе ветки адреса апгрейда и ванильный режим; для заголовка окна покрыты все
      четыре канала и неупакованный запуск, а в packages/desktop/src/main/windows.ts нет литерала
      "OpenCode" в качестве значения title

